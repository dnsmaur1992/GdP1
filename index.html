<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: eine Spalte, max. 560px, Bildschirm-für-Bildschirm wie eine Handy-App.
   ================================================================
   HIER FARBEN ÄNDERN  (z. B. Hochschulfarben aus dem CI-Handbuch)
   --accent = Hauptfarbe, --accent-ink = Text auf Hauptfarbe
   ================================================================ */
:root {
  /* Papier und Tinte: kühles Grau-Blau; Markenfarben aus dem Logo (Navy + Mint).
     HIER FARBEN ÄNDERN: --accent = Hauptfarbe, --ink = Farbe des Startpanels */
  --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #E9EDF3; --line: #D8DEE7; --line-2: #C3CCD9;
  --fg: #101A2B; --muted: #56627A;
  --accent: #087A50; --accent-ink: #FFFFFF; --accent-soft: #DDF3E9;
  --ok: #087A50; --ok-soft: #DDF3E9; --bad: #C2333D; --bad-soft: #FBE4E5; --warn: #985A00; --warn-soft: #FBEFD9;
  --ink: #16233A; --ink-2: #2A3D5E; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #16233A; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(16,26,43,.16);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1828; --surface: #16223A; --surface-2: #1D2B45; --line: #26385A; --line-2: #34496E;
  --fg: #E8EEF7; --muted: #95A6C0;
  --accent: #3DDC97; --accent-ink: #072117; --accent-soft: #15382F;
  --ok: #3DDC97; --ok-soft: #15382F; --bad: #FF8389; --bad-soft: #3C2030; --warn: #F2B14A; --warn-soft: #3A2C17;
  --ink: #1B2B4A; --ink-2: #2C4167; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #0B1322; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1828; --surface: #16223A; --surface-2: #1D2B45; --line: #26385A; --line-2: #34496E;
  --fg: #E8EEF7; --muted: #95A6C0;
  --accent: #3DDC97; --accent-ink: #072117; --accent-soft: #15382F;
  --ok: #3DDC97; --ok-soft: #15382F; --bad: #FF8389; --bad-soft: #3C2030; --warn: #F2B14A; --warn-soft: #3A2C17;
  --ink: #1B2B4A; --ink-2: #2C4167; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #0B1322; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(0,0,0,.45); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kopf */
.top { display: flex; align-items: center; gap: 12px; }
.top svg { width: 44px; height: 44px; flex: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; line-height: 1.1; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
/* Platz für ein zusätzliches Logo (siehe PARTNER_LOGO im Script) */
#partnerLogo { margin-left: auto; max-height: 40px; max-width: 120px; object-fit: contain; }

/* Startbildschirm */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.timepick { display: flex; align-items: baseline; gap: 8px; }
.timepick output { font-family: var(--f-display); font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timepick span { font-size: 18px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -8px; }
.plan { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.plan div { display: flex; gap: 8px; align-items: baseline; }
.plan .tag { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); flex: none; }
.plan .tag.rev { background: var(--bad-soft); color: var(--bad); }
.btn { border: 0; border-radius: 12px; padding: 14px 18px; min-height: 48px; font-weight: 600; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

.chapters { display: flex; flex-direction: column; }
.chap { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; width: 100%; }
.chap:first-child { border-top: 0; }
.chap .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; padding: 4px 0; text-align: center; border-radius: 8px; background: var(--surface-2); }
.chap.focus .code { background: var(--accent); color: var(--accent-ink); }
.chap .name { font-size: 15px; line-height: 1.3; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.chap .pct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Session */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.clock { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock.over { color: var(--warn); }
.prog { flex: 1; display: flex; gap: 4px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.prog i.done { background: var(--accent); }
.prog i.now { background: var(--muted); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 22px; }
.learn { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
pre code { background: none; padding: 0; color: inherit; font-size: inherit; border-radius: 0; }
pre .kw { color: var(--code-kw); }
pre .cm { color: #7F90A8; }
pre .st { color: #F5C26B; }
.q { font-weight: 600; font-size: 17px; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.ans { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 12px 14px; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.ans .k { font-family: var(--f-mono); font-size: 13px; color: var(--muted); flex: none; width: 18px; }
.ans.right { border-color: var(--ok); background: var(--ok-soft); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans:disabled { cursor: default; color: var(--fg); }
.why { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.why.ok { background: var(--ok-soft); }
.why.no { background: var(--bad-soft); }
.why b { display: block; font-family: var(--f-display); }
.task { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.timeup { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.timeup .btn { padding: 8px 14px; min-height: 40px; font-size: 15px; }
.big { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1.05; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.plancard p { margin: 0; }
.ready { display: flex; gap: 10px; align-items: center; }
.ready .bar { flex: 1; height: 8px; margin: 0; }
.plancard input[type=date] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); min-height: 40px; }
.updbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.seg.three { grid-template-columns: 1fr 1fr 1fr; }
.seg button { border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stmt { font-size: 17px; }
.stmt code { font-size: .95em; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .ans { justify-content: center; font-weight: 600; }
textarea { width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 12px; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
.hint { font-size: 14px; color: var(--muted); }
.reveal { display: flex; flex-direction: column; gap: 12px; }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.check label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; padding: 4px 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.ws { color: var(--muted); }
.soltext { white-space: pre-line; }
.verdict { font-family: var(--f-display); font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--bad); }
.weak { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.weak:first-of-type { border-top: 0; }
.weak-h { display: flex; gap: 10px; align-items: center; }
.weak-h .name { flex: 1; min-width: 0; font-weight: 500; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.hot { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 8px 14px; min-height: 44px; font-size: 15px; flex: 0 0 auto; }
.log { display: flex; flex-direction: column; }
.logitem { border-top: 1px solid var(--line); padding-block: 10px; }
.logitem:first-child { border-top: 0; }
.logitem summary { cursor: pointer; min-height: 32px; display: flex; gap: 8px; align-items: center; }
.logitem[open] { display: flex; flex-direction: column; gap: 8px; }
.hero { gap: 14px; }
.unitlink { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; text-align: left; background: var(--surface-2); border: 0; border-radius: 12px; padding: 12px 14px; color: var(--fg); min-height: 64px; }
.unitlink b { font-family: var(--f-display); font-size: 17px; }
.unitlink > span:last-child { font-size: 26px; color: var(--muted); }
.code.big { font-family: var(--f-mono); font-weight: 600; font-size: 15px; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 8px; }
.stages { display: flex; gap: 4px; margin-top: 6px; }
.stages i { flex: 1; height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: block; }
.stages b { display: block; height: 100%; background: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.back { align-self: flex-start; padding: 8px 14px; min-height: 44px; font-size: 15px; }
.stage { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.stage:first-child { border-top: 0; }
.stage .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.stage p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.esa { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.tlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tlist.num { list-style: decimal; }
.q p { margin: 0 0 8px; }
.file { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.file summary { cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 36px; }
.file[open] { display: flex; flex-direction: column; gap: 8px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.tests { border-collapse: collapse; width: 100%; font-size: 13px; }
table.tests th, table.tests td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.tests th { border-top: 0; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.tests code { background: none; padding: 0; white-space: pre; }
.seg.small button { min-height: 40px; font-size: 14px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; min-height: 44px; }
/* Lesetexte, Stolperfallen, Lückencode */
.read { display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; max-width: 68ch; }
.read p { margin: 0; }
.read .tlist { gap: 6px; }
.pit { border-left: 3px solid var(--warn); background: var(--surface-2); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; }
.pit b { display: block; font-family: var(--f-display); margin-bottom: 4px; }
input.gap { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; padding: 1px 4px; margin: 1px 0; border: 0; border-bottom: 2px solid var(--accent); border-radius: 4px 4px 0 0; background: rgba(127,144,168,.22); color: inherit; max-width: 100%; box-sizing: content-box; }
input.gap:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
input.gap.right { border-bottom-color: var(--ok); background: color-mix(in srgb, var(--ok) 25%, transparent); }
input.gap.wrong { border-bottom-color: var(--bad); background: color-mix(in srgb, var(--bad) 25%, transparent); }
.filltext input.gap { font-size: 15px; }
.filltext { font-size: 16px; line-height: 2; }
.filltext p { margin: 0; }
mark.sol { background: color-mix(in srgb, var(--ok) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.toc { display: flex; flex-direction: column; }
.tocitem { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 4px; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; width: 100%; font-size: 15px; }
.tick { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); color: var(--muted); }
.tick.on { background: var(--ok-soft); color: var(--ok); font-weight: 700; }

/* ================= Feinschliff: Typografie, Rhythmus, Register ================= */
body { -webkit-font-smoothing: antialiased; }
.app { gap: 24px; padding-block: 18px 56px; }
h1, h2, h3 { font-weight: 600; }
.label { font-family: var(--f-body); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
code { border-radius: 4px; padding: 1px 4px; }

/* Kopf + Tabs */
.top { gap: 10px; }
.top svg { width: 34px; height: 34px; }
.brand { flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.brand small { font-size: 13px; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-top: -8px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 0 11px; min-height: 44px; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 17px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.tabs button:hover { color: var(--fg); }

/* Abschnitte statt Karten: Inhalt liegt auf der Seite, Haarlinien trennen */
.panel { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 22px 0 0; gap: 14px; }
.panel h2, h2.sec { font-size: 21px !important; }
.btn { border-radius: 10px; font-size: 16px; transition: filter .15s, background .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn.ghost { border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface); }
.back { border: 0 !important; padding-left: 0; color: var(--muted); background: none !important; }
.back:hover { color: var(--fg); }

/* Klausur-Countdown + Register der 14 Einheiten */
.plancard { display: flex; flex-direction: column; gap: 12px; }
.countdown { display: flex; align-items: center; gap: 14px; line-height: 1.3; }
.countdown .days { font-family: var(--f-mono); font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.countdown .days.late { color: var(--warn); }
.countdown > span { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.countdown .hint { font-family: var(--f-body); font-weight: 400; font-size: 13px; }
.register { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.bit { display: block; aspect-ratio: 1; border-radius: 3px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.bit.half { background: linear-gradient(to top, var(--accent) 40%, transparent 40%); }
.bit.on { background: var(--accent); box-shadow: none; }

.bit.on.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.bit.sm { width: 12px; height: 12px; aspect-ratio: auto; border-radius: 2px; }
.plancard > p { font-size: 15px; }
.plancard details[open] { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

/* Startpanel: die eine laute Stelle der Seite – Navy wie das Logo */
.hero { background: var(--ink); color: var(--ink-fg); border-radius: 16px; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; border: 1px solid rgba(61,220,151,.18); box-shadow: 0 0 0 24px rgba(61,220,151,.035), 0 0 0 48px rgba(61,220,151,.02); pointer-events: none; }
.hero .hint { color: var(--ink-muted); }
.hero-top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-muted); }
.prompt { font-family: var(--f-mono); font-weight: 600; color: var(--mint); font-size: 14px; }
.unitlink { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; background: none; padding: 0; min-height: 0; color: inherit; border-radius: 8px; text-align: left; border: 0; position: relative; z-index: 1; }
.ucode { font-family: var(--f-mono); font-weight: 600; font-size: 30px; letter-spacing: -.03em; color: var(--mint); line-height: 1; }
.utitle { font-family: var(--f-display); font-size: 23px; font-weight: 600; line-height: 1.12; text-wrap: balance; }
.chev { font-size: 26px; color: var(--ink-muted); }
.steps3 { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.steps3 li { border-top: 3px solid var(--ink-2); padding-top: 7px; display: flex; flex-direction: column; font-size: 12px; color: var(--ink-muted); min-width: 0; line-height: 1.35; }
.steps3 li b { font-weight: 500; font-size: 13px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps3 li span { font-family: var(--f-mono); }
.steps3 li.ok { border-top-color: var(--mint); }
.steps3 li.now { border-top-color: var(--ink-fg); }
.steps3 li.now b, .steps3 li.now span { color: var(--ink-fg); }
.timepick { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 10px; --tr-on: var(--accent); --tr-off: var(--line-2); --th-bg: var(--surface); }
.hero .timepick { --tr-on: var(--mint); --tr-off: var(--ink-2); --th-bg: var(--ink); }
.timepick label { font-size: 13px; color: var(--muted); }
.hero .timepick label { color: var(--ink-muted); }
.tval { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.tval output { font-size: 26px; font-weight: 500; color: var(--fg); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hero .tval { color: var(--ink-muted); }
.hero .tval output { color: var(--ink-fg); }
.timepick input[type=range] { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; background: transparent; height: 32px; margin: 0; width: 100%; }
.timepick input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--tr-on) var(--p, 30%), var(--tr-off) var(--p, 30%)); }
.timepick input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--tr-off); }
.timepick input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--tr-on); }
.timepick input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--th-bg); border: 5px solid var(--tr-on); margin-top: -9px; }
.timepick input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--th-bg); border: 5px solid var(--tr-on); }
.tabs + .panel, .tabs + .plancard { border-top: 0; padding-top: 0; }
.hero .plan { font-size: 13.5px; color: var(--ink-fg); gap: 6px; }

.hero .plan .tag.rev { box-shadow: inset 0 0 0 1px rgba(255,131,137,.45); color: #FF9CA1; background: transparent; }
.hero .plan .hint { font-size: 13px; }
.hero .btn.go { background: var(--mint); color: #072117; font-size: 17px; min-height: 52px; }
.herolinks { display: flex; flex-wrap: wrap; gap: 0 20px; margin-top: -8px; }
.tlink { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--ink-fg); font-size: 14px; text-decoration: underline; text-decoration-color: rgba(232,238,247,.35); text-underline-offset: 4px; }

.hero :focus-visible { outline-color: var(--mint); }
.hero .chev, .hero .unitlink:hover .utitle { transition: color .15s; }

/* Kennzahlen: drei ruhige Zahlen, keine Kacheln */
.figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.figures .stat b { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.04em; line-height: 1.1; }
.figures .stat b small { font-size: 15px; color: var(--muted); letter-spacing: 0; }
.figures .stat span { font-size: 13px; color: var(--muted); }
.stats .stat b { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.03em; }

/* Lehrplan und Klausurbereiche */
.chap { grid-template-columns: 44px minmax(0,1fr) auto; padding: 13px 0; gap: 14px; }
.chap .code { background: none; font-size: 14px; text-align: left; padding: 0; color: var(--muted); }
.chap.focus .code { background: none; color: var(--accent); }
.chap.focus .name { font-weight: 600; }
.chap:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.stages { gap: 3px; margin-top: 7px; max-width: 168px; }

.tocitem { padding: 11px 0; }

.tick { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.tick.on { box-shadow: none; background: var(--ok-soft); }
.chip { border-color: var(--line-2); background: transparent; }
.chip:hover { border-color: var(--fg); }
.pill { font-family: var(--f-body); font-size: 12px; font-weight: 500; }
.esa { padding-block: 16px; }
.esa b { font-family: var(--f-display); font-size: 17px; }

/* Session */
.sbar { border-bottom: 0; padding-block: 12px; }
.prog i { height: 4px; }
.prog i.now { background: var(--fg); }
.clock { font-weight: 500; font-size: 20px; letter-spacing: -.03em; }
.iconbtn { border-color: var(--line-2); background: transparent; }
.card { border: 0; border-radius: 16px; padding: 22px 20px; gap: 16px; box-shadow: 0 0 0 1px var(--line), 0 14px 34px -20px var(--shadow); }
.card h2 { font-size: 26px; line-height: 1.12; }
.q { font-size: 18px; font-weight: 500; line-height: 1.45; }
.ans { border-color: var(--line-2); border-radius: 10px; padding: 12px 14px; gap: 12px; transition: border-color .12s, background .12s; }
.ans:hover:not(:disabled) { border-color: var(--fg); }
.ans .k { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; font-size: 12px; }
.ans.right .k { background: var(--ok); color: var(--surface); box-shadow: none; }
.ans.wrong .k { background: var(--bad); color: var(--surface); box-shadow: none; }
.why { border-radius: 0 10px 10px 0; border-left: 3px solid; padding: 12px 14px; line-height: 1.5; }
.why.ok { border-color: var(--ok); }
.why.no { border-color: var(--bad); }
.why b { margin-bottom: 3px; }
.learn { padding-left: 0; list-style: none; gap: 10px; }
.learn li { padding-left: 22px; position: relative; }
.learn li::before { content: ">"; position: absolute; left: 2px; top: 0; font-family: var(--f-mono); font-weight: 600; color: var(--accent); }
.task { border: 0; border-radius: 10px; background: var(--accent-soft); }
pre { border-radius: 10px; padding: 14px 16px; line-height: 1.6; }
.seg { background: none; box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 10px; padding: 3px; }
.seg button { border-radius: 8px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.big { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.04em; font-size: 34px; }

/* Lesetext: ruhig gesetzt wie ein gutes Skript */
.read { font-size: 16.5px; line-height: 1.68; gap: 14px; }
.read strong { font-weight: 600; }
.read pre { margin-block: 2px; }
.pit { border-left-color: var(--warn); background: var(--warn-soft); }
.pit b { color: var(--warn); }
input.gap { background: rgba(147,165,194,.2); border-bottom-color: var(--mint); }
.filltext input.gap { background: var(--surface-2); border-bottom-color: var(--accent); }

.unithead { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: start; }
.unithead .ucode { color: var(--accent); font-size: 28px; padding-top: 3px; }
.unithead h1 { font-size: 26px; line-height: 1.12; }
.unithead .hint { margin-top: 4px; }
:root:not([data-theme="light"]) .hero { box-shadow: inset 0 0 0 1px rgba(232,238,247,.06); }
@media (prefers-reduced-motion: no-preference) {
  .hero .prompt::after { content: ""; display: inline-block; width: .55em; height: 2px; margin-left: 2px; background: var(--mint); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
}
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .6 } } }
</style>

function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function mdBlock(s) { // Absätze und "- "-Listen
  var out = [], list = null;
  s.split("\n").forEach(function(line){
    if (/^- /.test(line)) { if (!list) { list = []; } list.push("<li>" + md(line.slice(2)) + "</li>"); }
    else { if (list) { out.push('<ul class="tlist">' + list.join("") + "</ul>"); list = null; } if (line.trim()) out.push("<p>" + md(line) + "</p>"); }
  });
  if (list) out.push('<ul class="tlist">' + list.join("") + "</ul>");
  return out.join("");
}
function hl(code) {
  var kws = "public|private|protected|static|final|void|int|long|short|byte|double|float|char|boolean|class|enum|new|return|if|else|for|while|do|switch|case|default|break|continue|try|catch|throw|throws|extends|abstract|import|package|this|super|null|true|false|instanceof";
  return code.split("\n").map(function(line){
    var ci = line.indexOf("//"); var body = line, cm = "";
    if (ci >= 0 && !/"[^"]*\/\/[^"]*"/.test(line)) { body = line.slice(0, ci); cm = line.slice(ci); }
    var out = esc(body).replace(new RegExp("(&quot;.*?&quot;)|\\b(" + kws + ")\\b", "g"), function(m, str, kw){
      return str ? '<span class="st">' + str + '</span>' : '<span class="kw">' + kw + '</span>';
    });
    return out + (cm ? '<span class="cm">' + esc(cm) + '</span>' : "");
  }).join("\n");
}

function checkStat(u) { return S.checks[u] || { best: 0, passed: false }; }
function unitDone(u) { var l = learnStat(u), p = progStat(u); return l.done === l.total && p.done >= p.total && checkStat(u).passed; }
function nextUnit() { for (var i = 0; i < UNITS.length; i++) if (!unitDone(UNITS[i].id)) return UNITS[i].id; return UNITS[UNITS.length - 1].id; }
function unitStage(u) {
  var l = learnStat(u), p = progStat(u), c = checkStat(u);
  if (l.done < l.total) return { id: "learn", text: "Lernen · " + l.done + "/" + l.total + " Häppchen" };
  if (p.done < p.total) return { id: "prog", text: "Programmieren · " + p.done + "/" + p.total + " Aufgaben" };
  if (!c.passed) return { id: "check", text: "Kapitel-Check steht an" };
  return { id: "done", text: "Abgeschlossen – Vertiefung und Wiederholung" };
}
function unitItems(u) { // alles, was zu einer Einheit abgefragt werden kann
  var it = [];
  UNIT[u].chap.nibbles.forEach(function(n){ n.quiz.forEach(function(_, i){ it.push({ type: "q", key: n.key + "|" + i, n: n, qi: i }); }); });
  EXAM.forEach(function(e){ if (e.rel.split("-")[0] === u && (e.type === "tf" || e.type === "trace")) it.push({ type: "exam", key: "ex:" + e.id, e: e }); });
  UNIT[u].gens.forEach(function(g){ if (GENS[g] && GENS[g].cat === "trace") it.push({ type: "gen", key: "g:" + g, gen: g }); });
  UNIT[u].chap.nibbles.forEach(function(n){ var r = readOf(n); if (r && r.fill) it.push({ type: "fill", key: "f:" + n.key, n: n }); });
  return it;
}
var COSTQ = { q: 1, exam: 1, gen: 4, fill: 2 };

// ---------- Sessions planen ----------
// 1) Fällige Wiederholungen  2) Rückblick auf abgeschlossene Einheiten  3) Arbeit an der gewählten Einheit
function itemFromKey(k) {
  if (k.indexOf("ex:") === 0) { var e = EXAM.filter(function(x){ return "ex:" + x.id === k; })[0]; return e ? { type: "exam", key: k, e: e } : null; }
  if (k.indexOf("g:") === 0) { var g = k.slice(2); return GENS[g] ? { type: "gen", key: k, gen: g } : null; }
  if (k.indexOf("f:") === 0) { var fn = byKey(k.slice(2)); return fn && readOf(fn) && readOf(fn).fill ? { type: "fill", key: k, n: fn } : null; }
  var p = k.split("|"), n = byKey(p[0]); return n && n.quiz[+p[1]] ? { type: "q", key: k, n: n, qi: +p[1] } : null;
}
function planUnit(u, minutes) {
  var items = [], used = 0, seenKeys = {};
  function add(it, cost, tag) { if (!it || seenKeys[it.key]) return false; seenKeys[it.key] = 1; it.tag = tag; items.push(it); used += cost; return true; }
  // 1) fällige Wiederholungen (max. ein Viertel der Zeit)
  var revBudget = Math.max(2, Math.round(minutes * 0.25));
  Object.keys(S.box).filter(isDue).sort(function(a, b){ return S.box[a].b - S.box[b].b; }).forEach(function(k){
    if (used >= revBudget) return; var it = itemFromKey(k); if (!it) return;
    if (it.type === "gen" && GENS[it.gen].cat !== "trace") return; // Schreibaufgaben kommen über die Einheit
    add(it, COSTQ[it.type], "rev");
  });
  // 2) Rückblick: abgeschlossene Einheiten (am längsten nicht gesehen zuerst)
  var doneUnits = UNITS.filter(function(x){ return x.id !== u && unitDone(x.id); });
  if (doneUnits.length) {
    var pool = []; doneUnits.forEach(function(x){ pool = pool.concat(unitItems(x.id)); });
    pool = shuffle(pool).sort(function(a, b){ return (S.seen[a.key] || 0) - (S.seen[b.key] || 0); });
    var rb = Math.max(2, Math.round(minutes * 0.2)), r0 = used;
    for (var i = 0; i < pool.length && used - r0 < rb; i++) if (!S.box[pool[i].key] || !isDue(pool[i].key)) add(pool[i], COSTQ[pool[i].type], "back");
  }
  // 3) Einheit
  var st = unitStage(u).id;
  if (st === "learn") {
    var ns = UNIT[u].chap.nibbles.filter(function(n){ return !S.done[n.key]; });
    for (var j = 0; j < ns.length; j++) { var m = est(ns[j]); if (used + m > minutes * 1.15 && items.some(function(x){ return x.type === "nibble"; })) break; items.push({ type: "nibble", n: ns[j], key: ns[j].key }); used += m; if (used >= minutes) break; }
  }
  if (st === "prog" || st === "done" || (st === "learn" && used < minutes - 6 && UNIT[u].gens.length && learnStat(u).done > 0)) {
    var gens = shuffle(UNIT[u].gens);
    for (var k = 0; used < minutes && k < 6; k++) {
      var g = gens[k % gens.length]; if (!g) break;
      var cost = GENS[g].cat === "trace" ? 4 : (GENS[g].def.mins || 10);
      if (used + cost > minutes + 3 && items.some(function(x){ return x.type === "task"; })) break;
      items.push({ type: "task", gen: g, key: "g:" + g }); used += Math.min(cost, 10);
    }
  }
  if (st === "check" && used < minutes) items.push({ type: "check", key: "check:" + u });
  return { items: items, minutes: used };
}

// ---------- Klausurtraining ----------
var COST = { tf: 1, trace: 4, explain: 3, write: 8 };
function examRank(e) { var b = S.box["ex:" + e.id]; if (!b) return 1; if (b.due > dayNum()) return 3; return b.b === 0 ? 0 : 2; }
function planExam(minutes) {
  var secs = S.efocus ? [S.efocus] : SECTIONS.map(function(s){ return s.id; });
  var pools = {};
  secs.forEach(function(id){
    pools[id] = EXAM.filter(function(e){ return e.sec === id; }).map(function(e, i){ return { e: e, r: examRank(e), i: i }; })
      .sort(function(a, b){ return a.r - b.r || a.i - b.i; }).filter(function(x){ return x.r < 3; }).map(function(x){ return x.e; });
  });
  var rot = (S.eruns || 0) % secs.length; secs = secs.slice(rot).concat(secs.slice(0, rot));
  var picked = [], used = 0, progress = true, round = 0;
  while (used < minutes && progress) {
    progress = false;
    secs.forEach(function(id){
      if (used >= minutes) return;
      var take = id === "A1" ? (round === 0 ? 4 : 2) : 1;
      for (var k = 0; k < take; k++) {
        var left = minutes - used, idx = -1;
        for (var j = 0; j < pools[id].length; j++) { if (COST[pools[id][j].type] <= left) { idx = j; break; } }
        if (idx < 0 && !picked.length && pools[id].length) idx = 0;
        if (idx < 0) break;
        var e = pools[id].splice(idx, 1)[0]; picked.push(e); used += COST[e.type]; progress = true;
      }
    });
    round++;
  }
  picked.sort(function(a, b){ return a.sec < b.sec ? -1 : a.sec > b.sec ? 1 : 0; });
  return { items: picked, minutes: used };
}
function secTitle(id) { return SECTIONS.filter(function(s){ return s.id === id; })[0].title; }

// ---------- Klausurplan: Zieldaten bis zur Klausur ----------
var WEIGHT = { EIP: 1, PUP: 1, PJA: 1, EJP: 1, VAR: 2, STA: 2, OBJ: 1.5, KLA: 3, VER: 2, ITR: 3, VRB: 3, EXC: 2, ARR: 3, ZKT: 2 };
var FINAL_DAYS = 14; // die letzten zwei Wochen: Klausurtraining und Wiederholung
function dateOf(dn) { return new Date(dn * 86400000); }
function dnOf(iso) { var p = iso.split("-"); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function fmtDate(dn) { var d = dateOf(dn); return ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][d.getUTCDay()] + " " + String(d.getUTCDate()).padStart(2, "0") + "." + String(d.getUTCMonth() + 1).padStart(2, "0") + "."; }
function examPlan() {
  if (!S.examDate) S.examDate = "2027-01-28";
  if (!S.planStart) { S.planStart = dayNum(); save(); }
  var exam = dnOf(S.examDate), start = S.planStart, learnEnd = exam - FINAL_DAYS;
  var total = 0; ORDER.forEach(function(u){ total += WEIGHT[u]; });
  var acc = 0, due = {};
  ORDER.forEach(function(u){ acc += WEIGHT[u]; due[u] = Math.round(start + (learnEnd - start) * acc / total); });
  var today = dayNum();
  var behind = ORDER.filter(function(u){ return due[u] < today && !unitDone(u); });
  var thisWeek = ORDER.filter(function(u){ return !unitDone(u) && due[u] >= today && due[u] < today + 7; });
  return { exam: exam, left: exam - today, learnEnd: learnEnd, due: due, behind: behind, thisWeek: thisWeek, finalPhase: today >= learnEnd };
}
// Klausurreife: grobe Schätzung aus abgeschlossenen Einheiten, sicheren Klausuraufgaben, Programmierpraxis und offenen Baustellen
function readiness() {
  var units = UNITS.filter(function(u){ return unitDone(u.id); }).length / UNITS.length;
  var exam = EXAM.filter(function(e){ var b = S.box["ex:" + e.id]; return b && b.b >= 2; }).length / EXAM.length;
  var solved = 0; Object.keys(S.prog).forEach(function(k){ solved += S.prog[k]; });
  var prog = Math.min(1, solved / 60);
  var weak = weakSpots().length, weakPen = Math.min(0.15, weak * 0.02);
  var score = Math.max(0, 0.35 * units + 0.3 * exam + 0.35 * prog - weakPen);
  var todo = [];
  if (units < 1) todo.push((UNITS.length - Math.round(units * UNITS.length)) + " Einheiten abschließen");
  if (prog < 1) todo.push("noch " + Math.max(0, 60 - solved) + " Programmieraufgaben (viele davon auf Papier)");
  if (exam < 1) todo.push(Math.round((1 - exam) * EXAM.length) + " Klausuraufgaben mehrfach sicher lösen");
  if (weak) todo.push(weak + " Baustelle" + (weak > 1 ? "n" : "") + " schließen");
  return { pct: Math.round(score * 100), todo: todo };
}
function planCard() {
  var P = examPlan(), R = readiness();
  var h = '<section class="plancard" aria-labelledby="h-plan"><div class="countdown"><b class="days' + (P.behind.length ? " late" : "") + '">' + Math.max(0, P.left) + '</b><span id="h-plan">' + (P.left >= 0 ? "Tage bis zur Klausur" : "Klausur vorbei") + '<br><span class="hint">' + fmtDate(P.exam) + ' · Ziel 1,0 · Klausurreife ' + R.pct + ' %</span></span></div>' + register(S.unit);
  if (P.finalPhase) h += '<p><b>Endspurt:</b> Jetzt täglich Klausurtraining und Baustellen. Schreib die Probeklausur ca. 4 Tage vorher einmal unter echten Bedingungen (nur Papier, Zeit stoppen).</p>';

  else h += '<p><b>Im Plan.</b> ' + (P.thisWeek.length ? "Diese Woche dran: " + P.thisWeek.map(function(u){ return u + " (bis " + fmtDate(P.due[u]) + ")"; }).join(", ") + "." : "Nächste Einheit: " + nextUnit() + " bis " + fmtDate(P.due[nextUnit()]) + ".") + '</p>';
  h += '<details><summary class="hint">Zeitplan, Klausurreife und Datum</summary><p class="hint">Klausurreife ist eine Schätzung aus deinem Fortschritt.' + (R.todo.length ? ' Noch offen: ' + R.todo.slice(0, 3).join(", ") + '.' : '') + '</p><ol class="tlist num">' + ORDER.map(function(u){ return '<li>' + u + ' bis ' + fmtDate(P.due[u]) + (unitDone(u) ? ' ✓' : '') + '</li>'; }).join("") + '<li>Ab ' + fmtDate(P.learnEnd) + ': Klausurtraining, Probeklausur, Wiederholung</li></ol>' +
    '<label class="hint" for="exDate">Klausurdatum</label> <input type="date" id="exDate" value="' + S.examDate + '"> <button class="linkbtn" id="replan">Plan ab heute neu verteilen</button></details></section>';

function unitView(u) {

  var cur = unitStage(u).id; function sb(id){ return 'btn small' + (cur === id ? '' : ' ghost'); }
  h += '<section class="panel"><div class="stage"><span class="num">1</span><div><b>Lernen</b><p class="hint">' + l.done + ' von ' + l.total + ' Häppchen mit Quiz</p></div><button class="' + sb("learn") + '" id="sLearn">' + (l.done < l.total ? "Weiter" : "Wiederholen") + '</button></div>';
  if (p.total) {

  }

  var rd = U.chap.nibbles.filter(function(n){ return S.read[n.key]; }).length;

    U.chap.nibbles.map(function(n, i){ return '<button class="tocitem" data-r="' + i + '"><span class="tick' + (S.read[n.key] ? " on" : "") + '" aria-hidden="true">' + (S.read[n.key] ? "✓" : i + 1) + '</span><span>' + esc(n.t) + '</span><span aria-hidden="true">›</span></button>'; }).join("") + '</div></section>';
  if (U.esa.length) {
    h += '<section class="panel"><h2 style="font-size:20px">Einsendeaufgaben vorbereiten</h2><p class="hint">Die Original-Aufgaben löst du selbst. Hier trainierst du genau die Bausteine, die sie verlangen – mit eigenen, ähnlichen Übungen.</p>';
    U.esa.forEach(function(e){
      h += '<div class="esa"><b>' + e.id + ' · ' + esc(e.title) + '</b><ul class="tlist">' + e.skills.map(function(s){ return "<li>" + md(s) + "</li>"; }).join("") + '</ul>' +
        '<div class="chips">' + e.gens.map(function(g){ return '<button class="chip" data-g="' + g + '">Üben: ' + esc(genTitle(g)) + '</button>'; }).join("") + '</div></div>';

  app.querySelectorAll("[data-g]").forEach(function(b){ b.onclick = function(){ startTasks([b.dataset.g], u); }; });
  app.querySelectorAll("[data-r]").forEach(function(b){ b.onclick = function(){ readerView(u, +b.dataset.r); }; });
}

// ---------- Skript: Lesen ohne Timer ----------
function readerView(u, i) {
  clearInterval(timer); sess = null;
  var ns = UNIT[u].chap.nibbles, n = ns[i], r = readOf(n);
  S.read[n.key] = true; save();
  var h = header() + '<button class="btn ghost back" id="back">← ' + u + '</button>' +
    '<article class="card"><span class="label">' + u + ' · Skript · Abschnitt ' + (i + 1) + ' von ' + ns.length + '</span><h2>' + esc(n.t) + '</h2>' + lessonHtml(n) +
    '<div class="row">' + (r && r.fill ? '<button class="btn ghost" id="rFill">' + (r.fill.kind === "java" ? "Lückencode" : "Lückentext") + ' üben</button>' : '') + '<button class="btn ghost" id="rQuiz">Quiz dazu</button></div>' +
    '<div class="row"><button class="btn ghost" id="rPrev"' + (i ? '' : ' disabled') + '>← Zurück</button><button class="btn" id="rNext">' + (i < ns.length - 1 ? "Weiter →" : "Fertig") + '</button></div></article>';
  render(h);
  document.getElementById("back").onclick = function(){ unitView(u); };
  document.getElementById("rPrev").onclick = function(){ if (i) readerView(u, i - 1); };
  document.getElementById("rNext").onclick = function(){ if (i < ns.length - 1) readerView(u, i + 1); else unitView(u); };
  var rf = document.getElementById("rFill"); if (rf) rf.onclick = function(){ newSess([{ k: "fill", n: n }], 5, { unit: u, reader: i }); };
  document.getElementById("rQuiz").onclick = function(){ newSess(n.quiz.map(function(_, qi){ return { k: "q", n: n, qi: qi }; }), 5, { unit: u, reader: i }); };
}

// ---------- Sessions starten ----------
function newSess(steps, mins, extra) {
  sess = Object.assign({ steps: steps, i: 0, end: Date.now() + mins * 60000, right: 0, total: 0, nibs: 0, tasksOk: 0, warned: false, started: Date.now(), concepts: {} }, extra || {});
  if (S.days.indexOf(today()) < 0) S.days.push(today());
  save(); clearInterval(timer); timer = setInterval(tick, 1000); step();
}
function nibbleSteps(n) {
  var st = [{ k: "learn", n: n }], r = readOf(n); if (r && r.fill) st.push({ k: "fill", n: n }); n.quiz.forEach(function(_, i){ st.push({ k: "q", n: n, qi: i }); });
  if (n.task) st.push({ k: "task", n: n }); st.push({ k: "fin", n: n }); return st;
}
function genStep(g, u) { var cat = GENS[g].cat; return { k: "gen", t: GEN.make(cat, seed(), g), unit: u || genUnit(g) }; }
function itemStep(it) {
  if (it.type === "q") return { k: "q", n: it.n, qi: it.qi, review: it.tag };
  if (it.type === "exam") return { k: "exam", e: it.e, review: it.tag };
  if (it.type === "fill") return { k: "fill", n: it.n, review: it.tag };
  if (it.type === "gen") { var s = genStep(it.gen); s.review = it.tag; return s; }
  return null;
}
function startUnit(u) {
  var p = planUnit(u, S.minutes), steps = [];
  p.items.forEach(function(it){
    if (it.type === "nibble") steps = steps.concat(nibbleSteps(it.n));
    else if (it.type === "task") steps.push(genStep(it.gen, u));
    else if (it.type === "check") steps = steps.concat(checkSteps(u));
    else { var s = itemStep(it); if (s) steps.push(s); }
  });
  newSess(steps, S.minutes, { unit: u, check: p.items.some(function(x){ return x.type === "check"; }) ? u : null });
}
function startLearn(u) {
  var ns = UNIT[u].chap.nibbles.filter(function(n){ return !S.done[n.key]; });
  if (!ns.length) ns = shuffle(UNIT[u].chap.nibbles).slice(0, 3);
  var steps = []; ns.slice(0, 4).forEach(function(n){ steps = steps.concat(nibbleSteps(n)); });
  newSess(steps, S.minutes, { unit: u });
}
function startTasks(gens, u) { newSess(gens.map(function(g){ return genStep(g, u); }), S.minutes, { unit: u, practice: true }); }
function checkSteps(u) {
  var qs = []; UNIT[u].chap.nibbles.forEach(function(n){ n.quiz.forEach(function(_, i){ qs.push({ k: "q", n: n, qi: i, check: true }); }); });
  var steps = shuffle(qs).slice(0, 6);
  shuffle(EXAM.filter(function(e){ return e.rel.split("-")[0] === u && e.type === "tf"; })).slice(0, 2).forEach(function(e){ steps.push({ k: "exam", e: e, check: true }); });
  var tr = UNIT[u].gens.filter(function(g){ return GENS[g].cat === "trace"; });
  if (tr.length) { var s = genStep(shuffle(tr)[0], u); s.check = true; steps.push(s); }
  var fl = UNIT[u].chap.nibbles.filter(function(n){ var r = readOf(n); return r && r.fill; });
  if (fl.length) steps.push({ k: "fill", n: shuffle(fl)[0], check: true });
  return steps;
}
function startCheck(u) { newSess(checkSteps(u), Math.max(S.minutes, 10), { unit: u, check: u }); }

// ---------- Session-Ablauf ----------
function remaining() { return Math.round((sess.end - Date.now()) / 1000); }
function fmt(s) { var a = Math.abs(s); return (s < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0"); }
function tick() {
  var c = document.getElementById("clock"); if (!c || !sess) return;
  var r = remaining(); c.textContent = fmt(r); c.classList.toggle("over", r < 0);
  if (r <= 0 && !sess.warned) { sess.warned = true; var tu = document.getElementById("timeup"); if (tu) tu.hidden = false; }
}
function showWs(t) { return t.split("\n").map(function(l){ var m = l.match(/^(.*?)( *)$/); return esc(m[1]) + '<span class="ws">' + m[2].replace(/ /g, "·") + '</span>'; }).join("\n"); }
function norm(t) { return t.replace(/\r/g, "").split("\n").map(function(l){ return l.replace(/\s+$/, ""); }).join("\n").replace(/\n+$/, ""); }
// Ausgaben vergleichen: Text exakt, Zahlen mit winziger Toleranz (verschiedene Java-Versionen runden die letzte Stelle anders)
function sameOutput(a, b) {
  a = norm(a).split("\n"); b = norm(b).split("\n"); if (a.length !== b.length) return false;
  var num = /-?\d+(?:\.\d+)?(?:E-?\d+)?/g;
  for (var i = 0; i < a.length; i++) {
    if (a[i] === b[i]) continue;
    if (a[i].replace(num, "#") !== b[i].replace(num, "#")) return false;
    var x = a[i].match(num) || [], y = b[i].match(num) || [];
    for (var j = 0; j < x.length; j++) { var p = parseFloat(x[j]), q = parseFloat(y[j]); if (Math.abs(p - q) > 1e-9 * Math.max(1, Math.abs(q))) return false; }
  }
  return true;
}
function sbar(cur, total) {
  return '<div class="sbar"><button class="iconbtn" id="quit" aria-label="Session beenden"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
    '<div class="prog" aria-label="Schritt ' + (cur + 1) + ' von ' + total + '">' + Array.apply(null, Array(total)).map(function(_, i){ return '<i class="' + (i < cur ? "done" : i === cur ? "now" : "") + '"></i>'; }).join("") + '</div>' +
    '<span class="clock" id="clock" role="timer" aria-label="Verbleibende Zeit">' + fmt(remaining()) + '</span></div>' +
    '<div class="timeup" id="timeup"' + (sess.warned ? "" : " hidden") + '><span>Deine Zeit ist um. Aktuellen Schritt noch abschließen?</span><button class="btn" id="stopNow">Jetzt beenden</button></div>';
}
function tagLine(s) {
  var lbl = s.review === "rev" ? '<span class="label" style="color:var(--bad)">Wiederholung</span>' : s.review === "back" ? '<span class="label" style="color:var(--accent)">Rückblick</span>' : s.check ? '<span class="label">Kapitel-Check</span>' : '';
  return lbl;
}
function step() {
  while (sess.i < sess.steps.length && sess.steps[sess.i].k === "fin") {
    var f = sess.steps[sess.i]; S.done[f.n.key] = true; sess.nibs++; save(); sess.i++;
    if (remaining() <= 0 && !sess.check) return summary();
  }
  if (sess.i >= sess.steps.length) return summary();
  var s = sess.steps[sess.i], bars = sess.steps.filter(function(x){ return x.k !== "fin"; }), cur = bars.indexOf(s);
  var h = sbar(cur, bars.length);
  if (s.k === "exam") h += examCard(s.e, tagLine(s));
  else if (s.k === "gen") h += genCard(s);
  else if (s.k === "fill") h += fillCard(s);
  else {
    var tag = '<span class="label">' + s.n.chap.id + ' · ' + esc(s.n.chap.title) + '</span>' + tagLine(s);
    if (s.k === "learn") {
      var rf = readOf(s.n);
      h += '<article class="card">' + tag + '<h2>' + esc(s.n.t) + '</h2>' + lessonHtml(s.n) + '<button class="btn" id="next">' + (rf && rf.fill ? "Verstanden, zum Lückencode" : "Verstanden, zum Quiz") + '</button></article>';
      S.read[s.n.key] = true; save();
    } else if (s.k === "q") {
      var q = s.n.quiz[s.qi];
      h += '<article class="card">' + tag + '<p class="q">' + md(q.q) + '</p><div class="answers">' +
        q.a.map(function(a, i){ return '<button class="ans" data-i="' + i + '"><span class="k">' + "ABCD"[i] + '</span><span>' + md(a) + '</span></button>'; }).join("") + '</div><div id="fb"></div></article>';
    } else if (s.k === "task") {
      var sol = SOLS[s.n.key];
      h += '<article class="card">' + tag + '<h2>Mini-Aufgabe</h2><div class="task"><p>' + md(s.n.task) + '</p><p class="hint">Am besten direkt in der IDE ausprobieren, ca. 5 Minuten.</p></div>' +
        (sol ? '<button class="btn ghost" id="showSol">Musterlösung zeigen</button><div id="sol" class="reveal" hidden><span class="label">Musterlösung</span><pre><code>' + hl(sol) + '</code></pre></div>' : '') +
        '<div class="row"><button class="btn ghost" id="skip">Später</button><button class="btn" id="next">Erledigt</button></div></article>';
    }
  }
  render(h);
  document.getElementById("quit").onclick = summary;
  document.getElementById("stopNow").onclick = summary;
  var nx = document.getElementById("next"); if (nx) nx.onclick = advance;
  var sk = document.getElementById("skip"); if (sk) sk.onclick = advance;
  var ss = document.getElementById("showSol"); if (ss) ss.onclick = function(){ document.getElementById("sol").hidden = false; ss.hidden = true; };
  if (s.k === "q") bindQuiz(s);
  if (s.k === "exam") bindExam(s.e);
  if (s.k === "gen") bindGen(s);
  if (s.k === "fill") bindFill(s);
}
function advance() { sess.i++; step(); }
function nextBtn() { return '<button class="btn" id="next" style="margin-top:14px;width:100%">Weiter</button>'; }

// ---------- Quiz ----------
function bindQuiz(s) {
  var q = s.n.quiz[s.qi], k = s.n.key + "|" + s.qi;
  app.querySelectorAll(".ans").forEach(function(b){
    b.onclick = function(){
      var pick = +b.dataset.i, ok = pick === q.c;
      app.querySelectorAll(".ans").forEach(function(x){ x.disabled = true; var i = +x.dataset.i; if (i === q.c) x.classList.add("right"); else if (i === pick) x.classList.add("wrong"); });
      S.answered++; if (ok) S.correct++;
      record(k, s.n.key, ok, { q: q.q, pick: q.a[pick], right: q.a[q.c], why: q.why });
      document.getElementById("fb").innerHTML = '<div class="why ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "Richtig" : "Nicht ganz – richtig ist " + "ABCD"[q.c]) + '</b>' + md(q.why) + '</div>' + (ok ? '' : nudge(s.n.key)) + nextBtn();
      var nx = document.getElementById("next"); nx.onclick = advance; nx.focus();
    };
  });
}

// ---------- Klausuraufgaben ----------
var TYPE_NAME = { tf: "Korrekt oder nicht?", trace: "Ausgabe angeben", write: "Code schreiben", explain: "Erläutern" };
function examCard(e, extra) {
  var h = '<article class="card"><span class="label">' + e.sec + ' · ' + esc(secTitle(e.sec)) + ' · ' + TYPE_NAME[e.type] + '</span>' + (extra || '');
  if (e.type === "tf") {
    h += '<p class="stmt">' + md(e.s) + '</p><p class="hint">Formuliere die Begründung erst im Kopf, dann tippen.</p><div class="tfrow"><button class="ans" data-v="1">Korrekt</button><button class="ans" data-v="0">Nicht korrekt</button></div>';
  } else if (e.type === "trace") {
    h += '<p class="q">Geben Sie exakt die produzierte Konsolenausgabe an.</p><pre><code>' + hl(e.code) + '</code></pre>' +
      '<label class="hint" for="ans-x">Deine Ausgabe</label><textarea id="ans-x" spellcheck="false" autocapitalize="off" placeholder="Zeile für Zeile, wie auf der Konsole"></textarea><button class="btn" id="reveal">Lösung zeigen</button>';
  } else {
    h += '<div class="q">' + mdBlock(e.type === "write" ? e.task : e.q) + '</div><label class="hint" for="ans-x">' + (e.type === "write" ? "Deine Lösung (Papier geht auch – wie in der Klausur)" : "Deine Antwort in Stichpunkten") + '</label>' +
      '<textarea id="ans-x" spellcheck="false" autocapitalize="off"' + (e.type === "write" ? ' style="min-height:200px"' : '') + '></textarea><button class="btn" id="reveal">' + (e.type === "write" ? "Musterlösung zeigen" : "Lösung zeigen") + '</button>';
  }
  return h + '<div id="fb" class="reveal"></div></article>';
}
function rateButtons(pre) { return '<p class="hint">Wie lief es?</p><div class="row"><button class="btn ghost" id="rateNo"' + (pre === 0 ? ' style="border-color:var(--bad)"' : '') + '>Nochmal üben</button><button class="btn" id="rateOk">Sitzt</button></div>'; }
function bindExam(e) {
  var fb = document.getElementById("fb");
  if (e.type === "tf") {
    app.querySelectorAll(".tfrow .ans").forEach(function(b){
      b.onclick = function(){
        var pick = b.dataset.v === "1", ok = pick === e.ok;
        app.querySelectorAll(".tfrow .ans").forEach(function(x){ x.disabled = true; var v = x.dataset.v === "1"; if (v === e.ok) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
        S.exam[e.id] = ok ? 1 : 0;
        record("ex:" + e.id, e.rel, ok, { q: e.s, pick: pick ? "korrekt" : "nicht korrekt", right: e.ok ? "korrekt" : "nicht korrekt", why: e.why });
        fb.innerHTML = '<div class="why ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "Richtig" : "Nicht ganz") + ' – die Aussage ist ' + (e.ok ? "korrekt" : "nicht korrekt") + '</b>' + md(e.why) + '</div>' + (ok ? '' : nudge(e.rel)) + nextBtn();

    });

  }
  var rv = document.getElementById("reveal");
  rv.onclick = function(){
    rv.hidden = true;
    var mine = document.getElementById("ans-x").value, pre = null, h = '';
    if (e.type === "trace") {
      h += '<span class="label">Erwartete Ausgabe <span style="text-transform:none;letter-spacing:0">(· = Leerzeichen)</span></span><pre><code>' + showWs(e.out) + '</code></pre>';
      if (mine.trim()) { var ok = sameOutput(mine, e.out); pre = ok ? 1 : 0; h += '<p class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "Stimmt überein" : "Weicht ab – vergleiche Zeile für Zeile") + '</p>'; }
      h += '<div class="why ok"><b>Erklärung</b>' + md(e.why) + '</div>';
    } else {

      if (e.type === "write") h += '<pre><code>' + hl(e.sol) + '</code></pre>'; else h += '<p class="soltext">' + md(e.sol) + '</p>' + (e.code ? '<pre><code>' + hl(e.code) + '</code></pre>' : '');
      h += checklist(e.check, "ex");

    bindRate(function(v){ S.exam[e.id] = v ? 1 : 0; record("ex:" + e.id, e.rel, v, { q: text, self: true, why: e.type === "trace" ? e.why : "" }); });
    fb.scrollIntoView({ behavior: "smooth", block: "start" });
  };
}
function checklist(items, id) {
  return '<span class="label">Darauf achten Korrektoren – hast du das?</span><ul class="check">' +
    items.map(function(c, i){ return '<li><label><input type="checkbox" id="ck-' + id + '-' + i + '"><span>' + md(c) + '</span></label></li>'; }).join("") + '</ul>';

function bindRate(fn) {

  document.getElementById("rateNo").onclick = function(){ fn(false); advance(); };
}

// ---------- Generierte Programmieraufgaben ----------
var FALLEN = ["Semikolon am Ende jeder Anweisung", "Jede geöffnete Klammer geschlossen ({ } ( ) [ ])", "Rückgabetyp passt, `return` in jedem Pfad", "Schleifengrenzen: `<` oder `<=`? Start bei 0 oder 1?", "Array: `.length` – String: `.length()`", "Strings mit `equals` vergleichen, nie mit `==`", "int / int schneidet ab – bei Bedarf `/ 2.0` oder Cast", "Summen/Zähler vor der Schleife initialisieren", "Groß-/Kleinschreibung von Namen exakt wie in der Aufgabe"];
function copyBtn(id, label) { return '<button class="btn ghost small copy" data-copy="' + id + '">' + label + '</button>'; }
function fileBlock(f, id, role) {

}
function testsTable(t) {
  if (!t.tests || !t.tests.length) return '';
  return '<div class="tablewrap"><table class="tests"><thead><tr><th>Test</th><th>erwartet</th></tr></thead><tbody>' +

}
// Lückencode aus der Musterlösung: einige Kernzeilen ausblenden
function lineGaps(s) {
  if (s.lgaps) return s.lgaps;
  var cand = [];
  s.t.solFiles.forEach(function(f, fi){
    f.content.split("\n").forEach(function(l, li){
      var x = l.trim();
      if (x.length < 6 || /^(\/\/|\/\*|\*|\}|\{|import |package |@)/.test(x)) return;
      if (/\bclass\b|\binterface\b|\benum\b/.test(x)) return;
      if (/^(public|private|protected|static)\b.*\)\s*(throws [\w., ]+)?\s*\{$/.test(x)) return; // Methodenköpfe bleiben stehen
      if (/^(private|protected|public)?\s*(static\s+)?(final\s+)?[\w<>\[\]]+\s+\w+;$/.test(x)) return; // reine Attributdeklarationen
      cand.push(fi + ":" + li);
    });
  });
  var k = Math.min(cand.length, Math.max(2, Math.min(5, Math.round(cand.length / 4))));
  s.lgaps = shuffle(cand).slice(0, k);
  return s.lgaps;
}
function lineGapHtml(s) {
  var gaps = lineGaps(s), h = '', n = 0;

  if (S.log.length) {

      var when = new Date(l.ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
      return '<details class="logitem"><summary><span class="muted mono" style="font-size:12px">' + when + '</span> ' + esc(conceptName(l.c)) + '</summary><p class="q" style="font-size:15px">' + md(l.q) + '</p>' +
        (l.self ? '<p class="hint">Selbst als „Nochmal üben“ markiert.</p>' : '<p><span class="pill hot">Deine Antwort</span> ' + md(l.pick) + '</p><p><span class="pill">Richtig</span> ' + md(l.right) + '</p>') + (l.why ? '<p class="hint">' + md(l.why) + '</p>' : '') + '</details>';
    }).join("") + '</div></section>';
  }
  render(h); bindWeak(); document.getElementById("back").onclick = home;
}
// Gezielt üben: Erklärung, alle Fragen zum Thema, passende Klausur- und Programmieraufgaben
function startFocus(k) {
  var n = byKey(k); if (!n) return;
  var steps = [{ k: "learn", n: n }]; n.quiz.forEach(function(_, i){ steps.push({ k: "q", n: n, qi: i }); });
  EXAM.filter(function(e){ return e.rel === k; }).sort(function(a, b){ return COST[a.type] - COST[b.type]; }).slice(0, 3).forEach(function(e){ steps.push({ k: "exam", e: e }); });
  Object.keys(GENS).filter(function(g){ return GENS[g].def.rel === k; }).slice(0, 2).forEach(function(g){ steps.push(genStep(g)); });
  newSess(steps, 15, { unit: n.chap.id });
}

// ---------- Webapp: Offline-Betrieb und automatische Updates ----------
var BUILD = "20261114-102059";
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic/.test(location.hostname)) {
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if (!reloading && !sess) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
    function checkUpdate() {
      reg.update().catch(function(){});
      fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(v){
        if (v.build && v.build !== BUILD && !document.getElementById("updBar")) {
          var bar = document.createElement("div"); bar.id = "updBar"; bar.className = "updbar";
          bar.innerHTML = '<span>Neue Version verfügbar.</span><button class="btn small" id="updGo">Jetzt laden</button>';
          document.body.appendChild(bar);
          document.getElementById("updGo").onclick = function(){ location.reload(); };
          if (!sess) location.reload();
        }
      }).catch(function(){});
    }
    checkUpdate();
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") checkUpdate(); });
  }).catch(function(){});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
