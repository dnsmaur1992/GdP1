<title>nibble GP1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: eine Spalte, max. 560px, Bildschirm-für-Bildschirm wie eine Handy-App.
   ================================================================
   HIER FARBEN ÄNDERN  (z. B. Hochschulfarben aus dem CI-Handbuch)
   --accent = Hauptfarbe, --accent-ink = Text auf Hauptfarbe
   ================================================================ */
:root {
  --bg: #F3F6FA; --surface: #FFFFFF; --surface-2: #E8EEF5; --line: #D3DCE8;
  --fg: #0E1726; --muted: #4E5D73;
  --accent: #0B8457; --accent-ink: #FFFFFF; --accent-soft: #D5F2E5;
  --ok: #0B8457; --ok-soft: #D5F2E5; --bad: #C8323B; --bad-soft: #FBE1E2; --warn: #9A6200;
  --code-bg: #0E1726; --code-fg: #D8E2F0; --code-kw: #3DDC97;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1726; --surface: #16233A; --surface-2: #1D2C46; --line: #2A3A55;
  --fg: #E6EDF7; --muted: #9FB0C8;
  --accent: #3DDC97; --accent-ink: #062016; --accent-soft: #143A31;
  --ok: #3DDC97; --ok-soft: #143A31; --bad: #FF7A80; --bad-soft: #3E1E27; --warn: #F5A524;
  --code-bg: #0A111D; --code-fg: #D8E2F0; --code-kw: #3DDC97; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1726; --surface: #16233A; --surface-2: #1D2C46; --line: #2A3A55;
  --fg: #E6EDF7; --muted: #9FB0C8;
  --accent: #3DDC97; --accent-ink: #062016; --accent-soft: #143A31;
  --ok: #3DDC97; --ok-soft: #143A31; --bad: #FF7A80; --bad-soft: #3E1E27; --warn: #F5A524;
  --code-bg: #0A111D; --code-fg: #D8E2F0; --code-kw: #3DDC97; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kopf */
.top { display: flex; align-items: center; gap: 12px; }
.top svg { width: 44px; height: 44px; flex: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; line-height: 1.1; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
/* Platz für ein zusätzliches Logo (siehe PARTNER_LOGO im Script) */
#partnerLogo { margin-left: auto; max-height: 40px; max-width: 120px; object-fit: contain; }

/* Startbildschirm */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.timepick { display: flex; align-items: baseline; gap: 8px; }
.timepick output { font-family: var(--f-display); font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timepick span { font-size: 18px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -8px; }
.plan { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.plan div { display: flex; gap: 8px; align-items: baseline; }
.plan .tag { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); flex: none; }
.plan .tag.rev { background: var(--bad-soft); color: var(--bad); }
.btn { border: 0; border-radius: 12px; padding: 14px 18px; min-height: 48px; font-weight: 600; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

.chapters { display: flex; flex-direction: column; }
.chap { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; width: 100%; }
.chap:first-child { border-top: 0; }
.chap .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; padding: 4px 0; text-align: center; border-radius: 8px; background: var(--surface-2); }
.chap.focus .code { background: var(--accent); color: var(--accent-ink); }
.chap .name { font-size: 15px; line-height: 1.3; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.chap .pct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Session */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.clock { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock.over { color: var(--warn); }
.prog { flex: 1; display: flex; gap: 4px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.prog i.done { background: var(--accent); }
.prog i.now { background: var(--muted); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 22px; }
.learn { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
pre .kw { color: var(--code-kw); }
pre .cm { color: #7F90A8; }
pre .st { color: #F5C26B; }
.q { font-weight: 600; font-size: 17px; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.ans { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 12px 14px; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.ans .k { font-family: var(--f-mono); font-size: 13px; color: var(--muted); flex: none; width: 18px; }
.ans.right { border-color: var(--ok); background: var(--ok-soft); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans:disabled { cursor: default; color: var(--fg); }
.why { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.why.ok { background: var(--ok-soft); }
.why.no { background: var(--bad-soft); }
.why b { display: block; font-family: var(--f-display); }
.task { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.timeup { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.timeup .btn { padding: 8px 14px; min-height: 40px; font-size: 15px; }
.big { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1.05; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stmt { font-size: 17px; }
.stmt code { font-size: .95em; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .ans { justify-content: center; font-weight: 600; }
textarea { width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 12px; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
.hint { font-size: 14px; color: var(--muted); }
.reveal { display: flex; flex-direction: column; gap: 12px; }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.check label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; padding: 4px 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.ws { color: var(--muted); }
.soltext { white-space: pre-line; }
.verdict { font-family: var(--f-display); font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--bad); }
.weak { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.weak:first-of-type { border-top: 0; }
.weak-h { display: flex; gap: 10px; align-items: center; }
.weak-h .name { flex: 1; min-width: 0; font-weight: 500; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.hot { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 8px 14px; min-height: 44px; font-size: 15px; flex: 0 0 auto; }
.log { display: flex; flex-direction: column; }
.logitem { border-top: 1px solid var(--line); padding-block: 10px; }
.logitem:first-child { border-top: 0; }
.logitem summary { cursor: pointer; min-height: 32px; display: flex; gap: 8px; align-items: center; }
.logitem[open] { display: flex; flex-direction: column; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; min-height: 44px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .6 } } }
</style>

<div class="app" id="app"></div>

<script>
/* ================================================================
   PARTNER_LOGO: Hier kann ein zusätzliches Logo eingetragen werden,
   z. B. eine Bild-URL oder eine data:-URI. Leer = kein Logo.
   ================================================================ */
var PARTNER_LOGO = "";

/*CONTENT*/
/*EXAM*/

// Reihenfolge der Lerneinheiten
var ORDER = ["EIP","PUP","PJA","EJP","VAR","STA","OBJ","KLA","VER","ITR","VRB","EXC","ARR","ZKT"];
CONTENT.sort(function(a,b){ return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });
CONTENT.forEach(function(c){ c.nibbles.forEach(function(n, i){ n.key = c.id + "-" + i; n.chap = c; }); });

var LOGO = '<svg viewBox="0 0 220 220" aria-hidden="true"><rect width="220" height="220" rx="52" fill="#16233A"/><path d="M58 78 L96 110 L58 142" fill="none" stroke="#E6EDF7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="108" y="132" width="54" height="14" rx="7" fill="#3DDC97"/><circle cx="70" cy="176" r="7" fill="#3DDC97"/><circle cx="96" cy="176" r="7" fill="#3DDC97"/><circle cx="122" cy="176" r="7" fill="#2A3A55"/><circle cx="148" cy="176" r="7" fill="#2A3A55"/></svg>';

// ---------- Speicher (nur in diesem Browser) ----------
var KEY = "nibble-gp1-v1";
var S = { minutes: 20, done: {}, wrong: {}, focus: null, days: [], answered: 0, correct: 0, mode: "learn", exam: {}, efocus: null, box: {}, stats: {}, log: [] };
try { var raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}
// Alte Version: einfache Fehlerliste in Boxen übernehmen
Object.keys(S.wrong || {}).forEach(function(k){ if (!S.box[k]) S.box[k] = { b: 0, due: 0 }; }); S.wrong = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Hilfen ----------
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function md(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function hl(code) {
  var kws = "public|private|protected|static|final|void|int|long|short|byte|double|float|char|boolean|class|enum|new|return|if|else|for|while|do|switch|case|default|break|continue|try|catch|throw|throws|extends|abstract|import|package|this|super|null|true|false|instanceof";
  return code.split("\n").map(function(line){
    var ci = line.indexOf("//"); var body = line, cm = "";
    if (ci >= 0 && !/"[^"]*\/\/[^"]*"/.test(line)) { body = line.slice(0, ci); cm = line.slice(ci); }
    var out = esc(body).replace(new RegExp("(&quot;.*?&quot;)|\\b(" + kws + ")\\b", "g"), function(m, str, kw){
      return str ? '<span class="st">' + str + '</span>' : '<span class="kw">' + kw + '</span>';
    });
    return out + (cm ? '<span class="cm">' + esc(cm) + '</span>' : "");
  }).join("\n");
}
function est(n) { return 3 + n.quiz.length + (n.task ? 5 : 0); } // Minuten
function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function streak() {
  var set = {}; S.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  if (!set[today()]) d.setDate(d.getDate() - 1);
  while (true) { var k = d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); if (!set[k]) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
function allNibbles() { var a = []; CONTENT.forEach(function(c){ a = a.concat(c.nibbles); }); return a; }
function byKey(k) { var p = k.split("-"); var c = CONTENT.filter(function(x){ return x.id === p[0]; })[0]; return c && c.nibbles[+p[1]]; }

// Session planen: erst falsch beantwortete Fragen wiederholen, dann neue Häppchen
// ---------- Lernsystem: Leitner-Boxen + Fehlerprofil ----------
var GAPS = [0, 1, 3, 7, 14];   // Tage bis zur nächsten Wiederholung je Box
function dayNum() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function isDue(k) { return S.box[k] && S.box[k].due <= dayNum(); }
// Jede Antwort läuft hier durch: Box anpassen, Thema zählen, Fehler protokollieren
function record(itemKey, concept, ok, detail) {
  var b = S.box[itemKey] || { b: 0, due: 0 };
  b.b = ok ? Math.min(b.b + 1, GAPS.length - 1) : 0;
  b.due = dayNum() + (ok ? GAPS[b.b] : 0);
  S.box[itemKey] = b;
  var st = S.stats[concept] || { n: 0, w: 0, ema: 0, last: 0 };
  st.n++; if (!ok) { st.w++; st.last = Date.now(); }
  st.ema = st.ema * 0.6 + (ok ? 0 : 1) * 0.4;   // jüngere Antworten zählen mehr
  S.stats[concept] = st;
  if (!ok && detail) {
    detail.c = concept; detail.ts = Date.now();
    S.log.unshift(detail); S.log = S.log.slice(0, 60);
  }
  if (sess) { sess.concepts[concept] = (sess.concepts[concept] || 0) + (ok ? 0 : 1); }
  save();
}
// Baustellen: Themen mit aktueller Fehlerneigung, schlimmste zuerst
function weakSpots() {
  return Object.keys(S.stats).filter(function(k){ var s = S.stats[k]; return s.w > 0 && s.ema >= 0.15 && byKey(k); })
    .sort(function(a, b){ return S.stats[b].ema - S.stats[a].ema || S.stats[b].w - S.stats[a].w; });
}
function dueCount() { return Object.keys(S.box).filter(isDue).length; }

function plan(minutes) {
  var items = [], used = 0;
  var maxRev = Math.max(2, Math.floor(minutes / 5));
  var rev = Object.keys(S.box).filter(function(k){ return k.indexOf("ex:") !== 0 && isDue(k); })
    .sort(function(a, b){ return S.box[a].b - S.box[b].b; }).slice(0, maxRev);
  rev.forEach(function(k){
    var p = k.split("|"), n = byKey(p[0]); if (!n) return; var q = n.quiz[+p[1]]; if (!q) return;
    items.push({ type: "review", n: n, qi: +p[1], key: k }); used += 1;
  });
  var pool = allNibbles().filter(function(n){ return !S.done[n.key]; });
  if (S.focus) pool = pool.filter(function(n){ return n.chap.id === S.focus; }).concat(pool.filter(function(n){ return n.chap.id !== S.focus; }));
  for (var i = 0; i < pool.length; i++) {
    var m = est(pool[i]);
    if (used + m > minutes && items.length) break;
    items.push({ type: "nibble", n: pool[i] }); used += m;
    if (used >= minutes) break;
  }
  return { items: items, minutes: used };
}

// ---------- Klausurtraining planen ----------
var COST = { tf: 1, trace: 4, explain: 3, write: 8 };
function examRank(e) { // 0 = fällig & zuletzt falsch, 1 = neu, 2 = fällige Auffrischung, 3 = noch nicht fällig
  var b = S.box["ex:" + e.id];
  if (!b) return 1;
  if (b.due > dayNum()) return 3;
  return b.b === 0 ? 0 : 2;
}
function planExam(minutes) {
  var secs = S.efocus ? [S.efocus] : SECTIONS.map(function(s){ return s.id; });
  var pools = {};
  secs.forEach(function(id){
    pools[id] = EXAM.filter(function(e){ return e.sec === id; })
      .map(function(e, i){ return { e: e, r: examRank(e), i: i }; })
      .sort(function(a, b){ return a.r - b.r || a.i - b.i; })
      .filter(function(x){ return x.r < 3; }).map(function(x){ return x.e; });
  });
  // Startabschnitt rotiert, damit kurze Sessions nicht immer nur A1/A2 treffen
  var rot = (S.eruns || 0) % secs.length;
  secs = secs.slice(rot).concat(secs.slice(0, rot));
  var picked = [], used = 0, progress = true, round = 0;
  while (used < minutes && progress) {
    progress = false;
    secs.forEach(function(id){
      if (used >= minutes) return;
      var take = id === "A1" ? (round === 0 ? 4 : 2) : 1; // Richtig/Falsch im Block, wie in der Klausur
      for (var k = 0; k < take; k++) {
        var left = minutes - used, idx = -1;
        for (var j = 0; j < pools[id].length; j++) { if (COST[pools[id][j].type] <= left) { idx = j; break; } }
        if (idx < 0 && !picked.length && pools[id].length) idx = 0;
        if (idx < 0) break;
        var e = pools[id].splice(idx, 1)[0]; picked.push(e); used += COST[e.type]; progress = true;
      }
    });
    round++;
  }
  picked.sort(function(a, b){ return a.sec < b.sec ? -1 : a.sec > b.sec ? 1 : 0; });
  return { items: picked, minutes: used };
}
function secTitle(id) { return SECTIONS.filter(function(s){ return s.id === id; })[0].title; }

// ---------- Ansichten ----------
var app = document.getElementById("app");
var timer = null, sess = null;

function header() {
  return '<header class="top">' + LOGO +
    '<div class="brand"><b>nibble<span>_</span></b><small>Grundlagen der Programmierung 1</small></div>' +
    '<img id="partnerLogo" alt="Logo" hidden></header>';
}
function applyPartner() {
  var img = document.getElementById("partnerLogo");
  if (img && PARTNER_LOGO) { img.src = PARTNER_LOGO; img.hidden = false; }
}
function currentPlan() { return S.mode === "exam" ? planExam(S.minutes) : plan(S.minutes); }

function home() {
  clearInterval(timer); sess = null;
  var ex = S.mode === "exam";
  var p = currentPlan();
  var html = header();
  html += '<div class="seg" role="group" aria-label="Modus">' +
    '<button id="mLearn" aria-pressed="' + !ex + '">Lernen</button>' +
    '<button id="mExam" aria-pressed="' + ex + '">Klausurtraining</button></div>';
  html += '<section class="panel" aria-labelledby="h-time">' +
    '<span class="label" id="h-time">Wie viel Zeit hast du gerade?</span>' +
    '<div class="timepick"><output id="minOut" for="min">' + S.minutes + '</output><span>Minuten</span></div>' +
    '<input type="range" id="min" min="10" max="45" step="5" value="' + S.minutes + '" aria-label="Lernzeit in Minuten">' +
    '<div class="ticks"><span>10</span><span>15</span><span>20</span><span>25</span><span>30</span><span>35</span><span>40</span><span>45</span></div>' +
    '<div class="plan" id="plan">' + planHtml(p) + '</div>' +
    '<button class="btn" id="go"' + (p.items.length ? "" : " disabled") + '>' + (ex ? "Training starten" : "Session starten") + '</button></section>';

  html += weakPanel(3);
  if (ex) {
    var sitzt = EXAM.filter(function(e){ return S.exam[e.id] === 1; }).length;
    var noch = EXAM.filter(function(e){ return S.exam[e.id] === 0; }).length;
    html += '<section class="panel stats" aria-label="Fortschritt">' +
      '<div class="stat"><b>' + sitzt + '/' + EXAM.length + '</b><small>Aufgaben sitzen</small></div>' +
      '<div class="stat"><b>' + noch + '</b><small>offen</small></div>' +
      '<div class="stat"><b>' + streak() + '</b><small>Tage in Folge</small></div></section>';
    html += '<section class="panel" aria-labelledby="h-sec"><span class="label" id="h-sec">Aufbau wie die Klausur · antippen für Fokus</span><div class="chapters">';
    SECTIONS.forEach(function(s){
      var all = EXAM.filter(function(e){ return e.sec === s.id; });
      var d = all.filter(function(e){ return S.exam[e.id] === 1; }).length;
      html += '<button class="chap' + (S.efocus === s.id ? " focus" : "") + '" data-s="' + s.id + '" aria-pressed="' + (S.efocus === s.id) + '">' +
        '<span class="code">' + s.id + '</span><span><span class="name">' + esc(s.title) + '</span><span class="bar"><i style="width:' + Math.round(100 * d / all.length) + '%"></i></span></span>' +
        '<span class="pct">' + d + '/' + all.length + '</span></button>';
    });
    html += '</div></section>';
  } else {
    var all = allNibbles(), done = all.filter(function(n){ return S.done[n.key]; }).length;
    var rate = S.answered ? Math.round(100 * S.correct / S.answered) : null;
    html += '<section class="panel stats" style="grid-template-columns:repeat(2,minmax(0,1fr))" aria-label="Fortschritt">' +
      '<div class="stat"><b>' + done + '/' + all.length + '</b><small>Häppchen</small></div>' +
      '<div class="stat"><b>' + (rate === null ? "–" : rate + " %") + '</b><small>Quiz richtig</small></div>' +
      '<div class="stat"><b>' + dueCount() + '</b><small>heute fällig</small></div>' +
      '<div class="stat"><b>' + streak() + '</b><small>Tage in Folge</small></div></section>';
    html += '<section class="panel" aria-labelledby="h-chap"><span class="label" id="h-chap">Lerneinheiten · antippen für Fokus</span><div class="chapters">';
    CONTENT.forEach(function(c){
      var d = c.nibbles.filter(function(n){ return S.done[n.key]; }).length, pc = Math.round(100 * d / c.nibbles.length);
      html += '<button class="chap' + (S.focus === c.id ? " focus" : "") + '" data-c="' + c.id + '" aria-pressed="' + (S.focus === c.id) + '">' +
        '<span class="code">' + c.id + '</span><span><span class="name">' + esc(c.title) + '</span><span class="bar"><i style="width:' + pc + '%"></i></span></span>' +
        '<span class="pct">' + d + '/' + c.nibbles.length + '</span></button>';
    });
    html += '</div></section>';
  }
  html += '<div class="foot">Fortschritt wird auf diesem Gerät gespeichert.<br>' +
    '<button class="linkbtn" id="exp">Fortschritt sichern</button>' +
    '<label class="linkbtn" for="imp" style="display:inline-block;cursor:pointer">Fortschritt laden</label><input type="file" id="imp" accept=".json,application/json" hidden>' +
    '<button class="linkbtn" id="reset">Zurücksetzen</button><div id="ioMsg" role="status" class="hint"></div></div>';
  app.innerHTML = html; applyPartner();

  bindWeak();
  var wa = document.getElementById("weakAll"); if (wa) wa.onclick = weakView;
  document.getElementById("mLearn").onclick = function(){ S.mode = "learn"; save(); home(); };
  document.getElementById("mExam").onclick = function(){ S.mode = "exam"; save(); home(); };
  var r = document.getElementById("min");
  r.addEventListener("input", function(){
    S.minutes = +r.value; document.getElementById("minOut").textContent = r.value;
    var p2 = currentPlan(); document.getElementById("plan").innerHTML = planHtml(p2);
    document.getElementById("go").disabled = !p2.items.length; save();
  });
  document.getElementById("go").onclick = function(){ start(currentPlan()); };
  app.querySelectorAll(".chap").forEach(function(b){
    b.onclick = function(){
      if (b.dataset.s) S.efocus = S.efocus === b.dataset.s ? null : b.dataset.s;
      else S.focus = S.focus === b.dataset.c ? null : b.dataset.c;
      save(); home();
    };
  });
  bindIO();
  var rs = document.getElementById("reset");
  rs.onclick = function(){
    if (rs.dataset.armed) { S.done = {}; S.wrong = {}; S.answered = 0; S.correct = 0; S.days = []; S.exam = {}; S.box = {}; S.stats = {}; S.log = []; save(); home(); }
    else { rs.dataset.armed = 1; rs.textContent = "Wirklich alles zurücksetzen? Nochmal tippen"; }
  };
}

var TYPE_NAME = { tf: "Korrekt oder nicht?", trace: "Ausgabe angeben", write: "Code schreiben", explain: "Erläutern" };
function planHtml(p) {
  if (!p.items.length) return '<p class="muted">Alles geschafft! Setz den Fortschritt zurück, um von vorn zu wiederholen.</p>';
  var h = '';
  if (S.mode === "exam") {
    var groups = {};
    p.items.forEach(function(e){ (groups[e.sec] = groups[e.sec] || []).push(e); });
    Object.keys(groups).forEach(function(sec){
      var types = {}; groups[sec].forEach(function(e){ types[e.type] = (types[e.type] || 0) + 1; });
      var desc = Object.keys(types).map(function(t){ return types[t] + "× " + TYPE_NAME[t]; }).join(", ");
      h += '<div><span class="tag">' + sec + '</span><span>' + esc(secTitle(sec)) + ' <span class="muted">· ' + desc + '</span></span></div>';
    });
    return h;
  }
  var rev = p.items.filter(function(x){ return x.type === "review"; }).length;
  if (rev) h += '<div><span class="tag rev">Wdh.</span><span>' + rev + ' Frage' + (rev > 1 ? "n" : "") + ' aus früheren Sessions</span></div>';
  p.items.filter(function(x){ return x.type === "nibble"; }).forEach(function(x){
    h += '<div><span class="tag">' + x.n.chap.id + '</span><span>' + esc(x.n.t) + '</span></div>';
  });
  return h;
}

// ---------- Session ----------
function start(p) {
  var steps = [];
  if (S.mode === "exam") {
    p.items.forEach(function(e){ steps.push({ k: "exam", e: e }); });
  } else {
    p.items.forEach(function(it){
      if (it.type === "review") steps.push({ k: "q", n: it.n, qi: it.qi, review: it.key });
      else {
        steps.push({ k: "learn", n: it.n });
        it.n.quiz.forEach(function(_, i){ steps.push({ k: "q", n: it.n, qi: i }); });
        if (it.n.task) steps.push({ k: "task", n: it.n });
        steps.push({ k: "fin", n: it.n });
      }
    });
  }
  sess = { steps: steps, i: 0, end: Date.now() + S.minutes * 60000, right: 0, total: 0, nibs: 0, warned: false, started: Date.now(), exam: S.mode === "exam", concepts: {} };
  if (S.mode === "exam") S.eruns = (S.eruns || 0) + 1;
  if (S.days.indexOf(today()) < 0) S.days.push(today());
  save();
  clearInterval(timer); timer = setInterval(tick, 1000);
  step();
}
function remaining() { return Math.round((sess.end - Date.now()) / 1000); }
function fmt(s) { var a = Math.abs(s); return (s < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0"); }
function tick() {
  var c = document.getElementById("clock"); if (!c || !sess) return;
  var r = remaining(); c.textContent = fmt(r); c.classList.toggle("over", r < 0);
  if (r <= 0 && !sess.warned) { sess.warned = true; var tu = document.getElementById("timeup"); if (tu) tu.hidden = false; }
}
function showWs(t) { // Leerzeichen am Zeilenende sichtbar machen
  return t.split("\n").map(function(l){
    var m = l.match(/^(.*?)( *)$/);
    return esc(m[1]) + '<span class="ws">' + m[2].replace(/ /g, "·") + '</span>';
  }).join("\n");
}
function norm(t) { return t.replace(/\r/g, "").split("\n").map(function(l){ return l.replace(/\s+$/, ""); }).join("\n").replace(/\n+$/, ""); }

function step() {
  while (sess.i < sess.steps.length && sess.steps[sess.i].k === "fin") {
    var f = sess.steps[sess.i]; S.done[f.n.key] = true; sess.nibs++; save(); sess.i++;
    if (remaining() <= 0) return summary();
  }
  if (sess.i >= sess.steps.length) return summary();
  if (sess.exam && sess.i > 0 && remaining() <= 0) return summary();
  var s = sess.steps[sess.i];
  var bars = sess.steps.filter(function(x){ return x.k !== "fin"; });
  var cur = bars.indexOf(s);
  var h = '<div class="sbar"><button class="iconbtn" id="quit" aria-label="Session beenden"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
    '<div class="prog" aria-label="Schritt ' + (cur + 1) + ' von ' + bars.length + '">' +
    bars.map(function(_, i){ return '<i class="' + (i < cur ? "done" : i === cur ? "now" : "") + '"></i>'; }).join("") + '</div>' +
    '<span class="clock" id="clock" role="timer" aria-label="Verbleibende Zeit">' + fmt(remaining()) + '</span></div>';
  h += '<div class="timeup" id="timeup"' + (sess.warned ? "" : " hidden") + '><span>Deine Zeit ist um. ' + (sess.exam ? "Diese Aufgabe noch abschließen?" : "Häppchen noch fertig machen?") + '</span><button class="btn" id="stopNow">Jetzt beenden</button></div>';

  if (s.k === "exam") { h += examCard(s.e); }
  else {
    var tag = '<span class="label">' + s.n.chap.id + ' · ' + esc(s.n.chap.title) + '</span>';
    if (s.k === "learn") {
      h += '<article class="card">' + tag + '<h2>' + esc(s.n.t) + '</h2><ul class="learn">' +
        s.n.learn.map(function(l){ return '<li>' + md(l) + '</li>'; }).join("") + '</ul>' +
        (s.n.code ? '<pre><code>' + hl(s.n.code) + '</code></pre>' : '') +
        '<button class="btn" id="next">Verstanden, zum Quiz</button></article>';
    } else if (s.k === "q") {
      var q = s.n.quiz[s.qi];
      h += '<article class="card">' + tag + (s.review ? '<span class="label" style="color:var(--bad)">Wiederholung</span>' : '') +
        '<p class="q">' + md(q.q) + '</p><div class="answers">' +
        q.a.map(function(a, i){ return '<button class="ans" data-i="' + i + '"><span class="k">' + "ABCD"[i] + '</span><span>' + md(a) + '</span></button>'; }).join("") +
        '</div><div id="fb"></div></article>';
    } else if (s.k === "task") {
      var sol = SOLS[s.n.key];
      h += '<article class="card">' + tag + '<h2>Mini-Aufgabe</h2><div class="task"><p>' + md(s.n.task) + '</p><p class="hint">Am besten direkt in der IDE ausprobieren, ca. 5 Minuten.</p></div>' +
        (sol ? '<button class="btn ghost" id="showSol">Musterlösung zeigen</button><div id="sol" class="reveal" hidden><span class="label">Musterlösung</span><pre><code>' + hl(sol) + '</code></pre></div>' : '') +
        '<div class="row"><button class="btn ghost" id="skip">Später</button><button class="btn" id="next">Erledigt</button></div></article>';
    }
  }
  app.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById("quit").onclick = summary;
  document.getElementById("stopNow").onclick = summary;
  var nx = document.getElementById("next"); if (nx) nx.onclick = function(){ sess.i++; step(); };
  var sk = document.getElementById("skip"); if (sk) sk.onclick = function(){ sess.i++; step(); };
  var ss = document.getElementById("showSol"); if (ss) ss.onclick = function(){ document.getElementById("sol").hidden = false; ss.hidden = true; };
  if (s.k === "q") bindQuiz(s);
  if (s.k === "exam") bindExam(s.e);
}

function examCard(e) {
  var h = '<article class="card"><span class="label">' + e.sec + ' · ' + esc(secTitle(e.sec)) + ' · ' + TYPE_NAME[e.type] + '</span>';
  if (e.type === "tf") {
    h += '<p class="stmt">' + md(e.s) + '</p><p class="hint">Formuliere die Begründung erst im Kopf, dann tippen.</p>' +
      '<div class="tfrow"><button class="ans" data-v="1">Korrekt</button><button class="ans" data-v="0">Nicht korrekt</button></div>';
  } else if (e.type === "trace") {
    h += '<p class="q">Geben Sie exakt die produzierte Konsolenausgabe an.</p><pre><code>' + hl(e.code) + '</code></pre>' +
      '<label class="hint" for="ans-' + e.id + '">Deine Ausgabe</label><textarea id="ans-' + e.id + '" spellcheck="false" autocapitalize="off" placeholder="Zeile für Zeile, wie auf der Konsole"></textarea>' +
      '<button class="btn" id="reveal">Lösung zeigen</button>';
  } else {
    h += '<p class="q soltext">' + md(e.type === "write" ? e.task : e.q) + '</p>' +
      '<label class="hint" for="ans-' + e.id + '">' + (e.type === "write" ? "Deine Lösung (Papier geht auch – wie in der Klausur)" : "Deine Antwort in Stichpunkten") + '</label>' +
      '<textarea id="ans-' + e.id + '" spellcheck="false" autocapitalize="off"' + (e.type === "write" ? ' style="min-height:200px"' : '') + '></textarea>' +
      '<button class="btn" id="reveal">' + (e.type === "write" ? "Musterlösung zeigen" : "Lösung zeigen") + '</button>';
  }
  return h + '<div id="fb" class="reveal"></div></article>';
}

function rateButtons(pre) {
  return '<p class="hint">Wie lief es?</p><div class="row">' +
    '<button class="btn ghost" id="rateNo"' + (pre === 0 ? ' style="border-color:var(--bad)"' : '') + '>Nochmal üben</button>' +
    '<button class="btn" id="rateOk">Sitzt</button></div>';
}
function bindRate(e) {
  function done(v) {
    S.exam[e.id] = v; sess.total++; if (v) sess.right++;
    var text = (e.type === "write" ? e.task : e.type === "trace" ? "Ausgabe angeben" : e.q).split("\n")[0];
    record("ex:" + e.id, e.rel, !!v, { q: text, self: true, why: e.type === "trace" ? e.why : "" });
    sess.i++; step();
  }
  document.getElementById("rateOk").onclick = function(){ done(1); };
  document.getElementById("rateNo").onclick = function(){ done(0); };
}

function bindExam(e) {
  var fb = document.getElementById("fb");
  if (e.type === "tf") {
    app.querySelectorAll(".tfrow .ans").forEach(function(b){
      b.onclick = function(){
        var pick = b.dataset.v === "1", ok = pick === e.ok;
        app.querySelectorAll(".tfrow .ans").forEach(function(x){
          x.disabled = true; var v = x.dataset.v === "1";
          if (v === e.ok) x.classList.add("right"); else if (x === b) x.classList.add("wrong");
        });
        S.exam[e.id] = ok ? 1 : 0; sess.total++; if (ok) sess.right++;
        record("ex:" + e.id, e.rel, ok, { q: e.s, pick: pick ? "korrekt" : "nicht korrekt", right: e.ok ? "korrekt" : "nicht korrekt", why: e.why });
        fb.innerHTML = '<div class="why ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "Richtig" : "Nicht ganz") + ' – die Aussage ist ' + (e.ok ? "korrekt" : "nicht korrekt") + '</b>' + md(e.why) + '</div>' + (ok ? '' : nudge(e.rel)) +
          '<button class="btn" id="next">Weiter</button>';
        var nx = document.getElementById("next"); nx.onclick = function(){ sess.i++; step(); }; nx.focus();
      };
    });
    return;
  }
  var rv = document.getElementById("reveal");
  rv.onclick = function(){
    rv.hidden = true;
    var mine = document.getElementById("ans-" + e.id).value, pre = null, h = '';
    if (e.type === "trace") {
      h += '<span class="label">Erwartete Ausgabe <span style="text-transform:none;letter-spacing:0">(· = Leerzeichen)</span></span><pre><code>' + showWs(e.out) + '</code></pre>';
      if (mine.trim()) {
        var ok = norm(mine) === norm(e.out); pre = ok ? 1 : 0;
        h += '<p class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "Stimmt überein (Leerzeichen am Zeilenende ignoriert)" : "Weicht ab – vergleiche Zeile für Zeile") + '</p>';
      }
      h += '<div class="why ok"><b>Erklärung</b>' + md(e.why) + '</div>';
    } else {
      h += '<span class="label">' + (e.type === "write" ? "Musterlösung" : "Lösung") + '</span>';
      if (e.type === "write") h += '<pre><code>' + hl(e.sol) + '</code></pre>';
      else h += '<p class="soltext">' + md(e.sol) + '</p>' + (e.code ? '<pre><code>' + hl(e.code) + '</code></pre>' : '');
      h += '<span class="label">Darauf achten Korrektoren – hast du das?</span><ul class="check">' +
        e.check.map(function(c, i){ return '<li><label><input type="checkbox" id="ck-' + e.id + '-' + i + '"><span>' + md(c) + '</span></label></li>'; }).join("") + '</ul>';
    }
    fb.innerHTML = h + rateButtons(pre);
    bindRate(e);
    fb.scrollIntoView({ behavior: "smooth", block: "start" });
  };
}

function bindQuiz(s) {
  var q = s.n.quiz[s.qi], k = s.n.key + "|" + s.qi;
  app.querySelectorAll(".ans").forEach(function(b){
    b.onclick = function(){
      var pick = +b.dataset.i, ok = pick === q.c;
      app.querySelectorAll(".ans").forEach(function(x){
        x.disabled = true; var i = +x.dataset.i;
        if (i === q.c) x.classList.add("right"); else if (i === pick) x.classList.add("wrong");
      });
      sess.total++; S.answered++; if (ok) { sess.right++; S.correct++; }
      record(k, s.n.key, ok, { q: q.q, pick: q.a[pick], right: q.a[q.c], why: q.why });
      document.getElementById("fb").innerHTML = '<div class="why ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "Richtig" : "Nicht ganz – richtig ist " + "ABCD"[q.c]) + '</b>' + md(q.why) + '</div>' + (ok ? '' : nudge(s.n.key)) +
        '<button class="btn" id="next" style="margin-top:14px;width:100%">Weiter</button>';
      var nx = document.getElementById("next"); nx.onclick = function(){ sess.i++; step(); }; nx.focus();
    };
  });
}

function summary() {
  clearInterval(timer);
  var mins = Math.max(1, Math.round((Date.now() - sess.started) / 60000));
  var ex = sess.exam;
  var noch = ex ? EXAM.filter(function(e){ return S.exam[e.id] === 0; }).length : Object.keys(S.wrong).length;
  var h = header() + '<article class="card"><span class="label">' + (ex ? "Training beendet" : "Session beendet") + '</span>' +
    '<p class="big">' + (ex ? sess.total + ' Aufgaben' : sess.nibs + ' Häppchen') + ' in ' + mins + ' Min.</p>' +
    '<div class="stats"><div class="stat"><b>' + sess.right + '/' + sess.total + '</b><small>' + (ex ? "sitzen" : "Fragen richtig") + '</small></div>' +
    '<div class="stat"><b>' + noch + '</b><small>zum Wiederholen</small></div>' +
    '<div class="stat"><b>' + streak() + '</b><small>Tage in Folge</small></div></div>' +
    '<p class="muted">Was nicht saß, kommt in der nächsten Session wieder. Was saß, wird nach 1, 3, 7 und 14 Tagen nochmal geprüft, damit es hängen bleibt.</p>' +
    sessionWeak(sess.concepts) +
    '<button class="btn" id="home">Zur Übersicht</button></article>';
  sess = null; app.innerHTML = h; applyPartner(); bindWeak();
  document.getElementById("home").onclick = home;
}


// ---------- Sichern & Laden (z. B. für Gerätewechsel) ----------
function bindIO() {
  var msg = document.getElementById("ioMsg");
  document.getElementById("exp").onclick = function(){
    var data = JSON.stringify(S);
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = "nibble-fortschritt-" + today() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = "Datei wird heruntergeladen.";
    } catch (e) { msg.textContent = "Download nicht möglich."; }
    if (navigator.clipboard) navigator.clipboard.writeText(data).then(function(){ msg.textContent += " Zusätzlich in die Zwischenablage kopiert."; }, function(){});
  };
  document.getElementById("imp").onchange = function(ev){
    var f = ev.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try { var d = JSON.parse(r.result); if (!d || typeof d.done !== "object") throw 0; Object.assign(S, d); save(); home(); }
      catch (e) { msg.textContent = "Die Datei ist keine gültige nibble-Sicherung."; }
    };
    r.readAsText(f);
  };
}

// ---------- Baustellen ----------
function conceptName(k) { var n = byKey(k); return n ? n.t : k; }
function relatedExam(k) { return EXAM.filter(function(e){ return e.rel === k; }); }
function nudge(k) {
  var st = S.stats[k];
  if (!st || st.w < 2) return '';
  return '<p class="hint" style="margin-top:10px">„' + esc(conceptName(k)) + '“ hakt öfter (' + st.w + '× falsch). Du findest es unter <b>Meine Baustellen</b> zum gezielten Üben.</p>';
}
function weakRow(k) {
  var st = S.stats[k], n = byKey(k), pct = Math.round(st.ema * 100);
  var lvl = st.ema >= 0.5 ? "Hakt" : st.ema >= 0.3 ? "Wackelt" : "Wird besser";
  return '<div class="weak"><div class="weak-h"><span class="code" style="font-family:var(--f-mono);font-size:12px">' + n.chap.id + '</span>' +
    '<span class="name">' + esc(n.t) + '</span><span class="pill' + (st.ema >= 0.5 ? " hot" : "") + '">' + lvl + '</span></div>' +
    '<div class="bar" aria-label="Fehlerneigung ' + pct + ' Prozent"><i style="width:' + Math.max(6, pct) + '%;background:var(--bad)"></i></div>' +
    '<div class="row" style="align-items:center"><span class="hint" style="flex:1 1 160px">' + st.w + ' von ' + st.n + ' Antworten falsch</span>' +
    '<button class="btn ghost small" data-train="' + k + '">Gezielt üben</button></div></div>';
}
function weakPanel(max) {
  var w = weakSpots(); if (!w.length) return '';
  return '<section class="panel" aria-labelledby="h-weak"><span class="label" id="h-weak">Meine Baustellen</span>' +
    w.slice(0, max).map(weakRow).join("") +
    '<button class="linkbtn" id="weakAll" style="align-self:flex-start">Alle Baustellen und Fehler ansehen</button></section>';
}
function sessionWeak(c) {
  var ks = Object.keys(c || {}).filter(function(k){ return c[k] > 0 && byKey(k); });
  if (!ks.length) return '';
  return '<span class="label">Heute schwierig</span>' + ks.map(function(k){
    return '<div class="row" style="align-items:center"><span style="flex:1 1 160px">' + esc(conceptName(k)) + ' <span class="muted">· ' + c[k] + '× falsch</span></span>' +
      '<button class="btn ghost small" data-train="' + k + '">Gleich üben</button></div>';
  }).join("");
}
function bindWeak() {
  app.querySelectorAll("[data-train]").forEach(function(b){ b.onclick = function(){ startFocus(b.dataset.train); }; });
}
function weakView() {
  clearInterval(timer); sess = null;
  var w = weakSpots();
  var h = header() + '<button class="btn ghost" id="back" style="align-self:flex-start;padding:8px 14px;min-height:44px">← Übersicht</button>' +
    '<section class="panel"><h2 style="font-size:22px">Meine Baustellen</h2>' +
    '<p class="hint">Sortiert nach aktueller Fehlerneigung: Neuere Antworten zählen stärker. Sobald du ein Thema mehrmals richtig hast, rutscht es nach unten und verschwindet.</p>' +
    (w.length ? w.map(weakRow).join("") : '<p class="muted">Gerade keine Baustellen. Stark!</p>') + '</section>';
  if (S.log.length) {
    h += '<section class="panel"><h2 style="font-size:20px">Letzte Fehler</h2><div class="log">' + S.log.slice(0, 25).map(function(l){
      var when = new Date(l.ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
      return '<details class="logitem"><summary><span class="muted mono" style="font-size:12px">' + when + '</span> ' + esc(conceptName(l.c)) + '</summary>' +
        '<p class="q" style="font-size:15px">' + md(l.q) + '</p>' +
        (l.self ? '<p class="hint">Selbst als „Nochmal üben“ markiert.</p>' :
          '<p><span class="pill hot">Deine Antwort</span> ' + md(l.pick) + '</p><p><span class="pill">Richtig</span> ' + md(l.right) + '</p>') +
        (l.why ? '<p class="hint">' + md(l.why) + '</p>' : '') + '</details>';
    }).join("") + '</div></section>';
  }
  app.innerHTML = h; applyPartner(); bindWeak();
  document.getElementById("back").onclick = home;
  window.scrollTo(0, 0);
}
// Gezielt üben: Erklärung nochmal, alle Fragen zum Thema, passende Klausuraufgaben
function startFocus(k) {
  var n = byKey(k); if (!n) return;
  var steps = [{ k: "learn", n: n, focus: true }];
  n.quiz.forEach(function(_, i){ steps.push({ k: "q", n: n, qi: i }); });
  relatedExam(k).sort(function(a, b){ return COST[a.type] - COST[b.type]; }).slice(0, 4)
    .forEach(function(e){ steps.push({ k: "exam", e: e }); });
  var mins = Math.max(10, Math.min(30, 3 + n.quiz.length + steps.filter(function(s){ return s.e; }).reduce(function(a, s){ return a + COST[s.e.type]; }, 0)));
  sess = { steps: steps, i: 0, end: Date.now() + mins * 60000, right: 0, total: 0, nibs: 0, warned: false, started: Date.now(), exam: false, concepts: {}, focusKey: k };
  if (S.days.indexOf(today()) < 0) { S.days.push(today()); save(); }
  clearInterval(timer); timer = setInterval(tick, 1000);
  step();
}

home();

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
</script>
