<title>nibble GP1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: eine Spalte, max. 560px, Bildschirm-für-Bildschirm wie eine Handy-App.
   ================================================================
   HIER FARBEN ÄNDERN  (z. B. Hochschulfarben aus dem CI-Handbuch)
   --accent = Hauptfarbe, --accent-ink = Text auf Hauptfarbe
   ================================================================ */
:root {
  /* Papier und Tinte: kühles Grau-Blau; Markenfarben aus dem Logo (Navy + Mint).
     HIER FARBEN ÄNDERN: --accent = Hauptfarbe, --ink = Farbe des Startpanels */
  --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #E9EDF3; --line: #D8DEE7; --line-2: #C3CCD9;
  --fg: #101A2B; --muted: #56627A;
  --accent: #087A50; --accent-ink: #FFFFFF; --accent-soft: #DDF3E9;
  --ok: #087A50; --ok-soft: #DDF3E9; --bad: #C2333D; --bad-soft: #FBE4E5; --warn: #985A00; --warn-soft: #FBEFD9;
  --ink: #16233A; --ink-2: #2A3D5E; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #16233A; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(16,26,43,.16);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1828; --surface: #16223A; --surface-2: #1D2B45; --line: #26385A; --line-2: #34496E;
  --fg: #E8EEF7; --muted: #95A6C0;
  --accent: #3DDC97; --accent-ink: #072117; --accent-soft: #15382F;
  --ok: #3DDC97; --ok-soft: #15382F; --bad: #FF8389; --bad-soft: #3C2030; --warn: #F2B14A; --warn-soft: #3A2C17;
  --ink: #1B2B4A; --ink-2: #2C4167; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #0B1322; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1828; --surface: #16223A; --surface-2: #1D2B45; --line: #26385A; --line-2: #34496E;
  --fg: #E8EEF7; --muted: #95A6C0;
  --accent: #3DDC97; --accent-ink: #072117; --accent-soft: #15382F;
  --ok: #3DDC97; --ok-soft: #15382F; --bad: #FF8389; --bad-soft: #3C2030; --warn: #F2B14A; --warn-soft: #3A2C17;
  --ink: #1B2B4A; --ink-2: #2C4167; --ink-fg: #E8EEF7; --ink-muted: #93A5C2; --mint: #3DDC97;
  --code-bg: #0B1322; --code-fg: #DCE5F2; --code-kw: #3DDC97; --shadow: rgba(0,0,0,.45); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Kopf */
.top { display: flex; align-items: center; gap: 12px; }
.top svg { width: 44px; height: 44px; flex: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; line-height: 1.1; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
/* Platz für ein zusätzliches Logo (siehe PARTNER_LOGO im Script) */
#partnerLogo { margin-left: auto; max-height: 40px; max-width: 120px; object-fit: contain; }

/* Startbildschirm */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.timepick { display: flex; align-items: baseline; gap: 8px; }
.timepick output { font-family: var(--f-display); font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timepick span { font-size: 18px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -8px; }
.plan { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.plan div { display: flex; gap: 8px; align-items: baseline; }
.plan .tag { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); flex: none; }
.plan .tag.rev { background: var(--bad-soft); color: var(--bad); }
.btn { border: 0; border-radius: 12px; padding: 14px 18px; min-height: 48px; font-weight: 600; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

.chapters { display: flex; flex-direction: column; }
.chap { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; width: 100%; }
.chap:first-child { border-top: 0; }
.chap .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; padding: 4px 0; text-align: center; border-radius: 8px; background: var(--surface-2); }
.chap.focus .code { background: var(--accent); color: var(--accent-ink); }
.chap .name { font-size: 15px; line-height: 1.3; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.chap .pct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Session */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.clock { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock.over { color: var(--warn); }
.prog { flex: 1; display: flex; gap: 4px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.prog i.done { background: var(--accent); }
.prog i.now { background: var(--muted); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 22px; }
.learn { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
pre code { background: none; padding: 0; color: inherit; font-size: inherit; border-radius: 0; }
pre .kw { color: var(--code-kw); }
pre .cm { color: #7F90A8; }
pre .st { color: #F5C26B; }
.q { font-weight: 600; font-size: 17px; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.ans { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 12px 14px; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.ans .k { font-family: var(--f-mono); font-size: 13px; color: var(--muted); flex: none; width: 18px; }
.ans.right { border-color: var(--ok); background: var(--ok-soft); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans:disabled { cursor: default; color: var(--fg); }
.why { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.why.ok { background: var(--ok-soft); }
.why.no { background: var(--bad-soft); }
.why b { display: block; font-family: var(--f-display); }
.task { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.timeup { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.timeup .btn { padding: 8px 14px; min-height: 40px; font-size: 15px; }
.big { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1.05; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.plancard p { margin: 0; }
.ready { display: flex; gap: 10px; align-items: center; }
.ready .bar { flex: 1; height: 8px; margin: 0; }
.plancard input[type=date] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); min-height: 40px; }
.updbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.seg.three { grid-template-columns: 1fr 1fr 1fr; }
.seg button { border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stmt { font-size: 17px; }
.stmt code { font-size: .95em; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .ans { justify-content: center; font-weight: 600; }
textarea { width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 12px; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
.hint { font-size: 14px; color: var(--muted); }
.reveal { display: flex; flex-direction: column; gap: 12px; }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.check label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; padding: 4px 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.ws { color: var(--muted); }
.soltext { white-space: pre-line; }
.verdict { font-family: var(--f-display); font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--bad); }
.weak { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.weak:first-of-type { border-top: 0; }
.weak-h { display: flex; gap: 10px; align-items: center; }
.weak-h .name { flex: 1; min-width: 0; font-weight: 500; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.hot { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 8px 14px; min-height: 44px; font-size: 15px; flex: 0 0 auto; }
.log { display: flex; flex-direction: column; }
.logitem { border-top: 1px solid var(--line); padding-block: 10px; }
.logitem:first-child { border-top: 0; }
.logitem summary { cursor: pointer; min-height: 32px; display: flex; gap: 8px; align-items: center; }
.logitem[open] { display: flex; flex-direction: column; gap: 8px; }
.hero { gap: 14px; }
.unitlink { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; text-align: left; background: var(--surface-2); border: 0; border-radius: 12px; padding: 12px 14px; color: var(--fg); min-height: 64px; }
.unitlink b { font-family: var(--f-display); font-size: 17px; }
.unitlink > span:last-child { font-size: 26px; color: var(--muted); }
.code.big { font-family: var(--f-mono); font-weight: 600; font-size: 15px; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 8px; }
.stages { display: flex; gap: 4px; margin-top: 6px; }
.stages i { flex: 1; height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: block; }
.stages b { display: block; height: 100%; background: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.back { align-self: flex-start; padding: 8px 14px; min-height: 44px; font-size: 15px; }
.stage { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.stage:first-child { border-top: 0; }
.stage .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.stage p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.esa { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.tlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tlist.num { list-style: decimal; }
.q p { margin: 0 0 8px; }
.file { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.file summary { cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 36px; }
.file[open] { display: flex; flex-direction: column; gap: 8px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.tests { border-collapse: collapse; width: 100%; font-size: 13px; }
table.tests th, table.tests td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.tests th { border-top: 0; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.tests code { background: none; padding: 0; white-space: pre; }
.seg.small button { min-height: 40px; font-size: 14px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; min-height: 44px; }
/* Lesetexte, Stolperfallen, Lückencode */
.read { display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; max-width: 68ch; }
.read p { margin: 0; }
.read .tlist { gap: 6px; }
.pit { border-left: 3px solid var(--warn); background: var(--surface-2); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; }
.pit b { display: block; font-family: var(--f-display); margin-bottom: 4px; }
input.gap { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; padding: 1px 4px; margin: 1px 0; border: 0; border-bottom: 2px solid var(--accent); border-radius: 4px 4px 0 0; background: rgba(127,144,168,.22); color: inherit; max-width: 100%; box-sizing: content-box; }
input.gap:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
input.gap.right { border-bottom-color: var(--ok); background: color-mix(in srgb, var(--ok) 25%, transparent); }
input.gap.wrong { border-bottom-color: var(--bad); background: color-mix(in srgb, var(--bad) 25%, transparent); }
.filltext input.gap { font-size: 15px; }
.filltext { font-size: 16px; line-height: 2; }
.filltext p { margin: 0; }
mark.sol { background: color-mix(in srgb, var(--ok) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.toc { display: flex; flex-direction: column; }
.tocitem { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 4px; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; width: 100%; font-size: 15px; }
.tick { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); color: var(--muted); }
.tick.on { background: var(--ok-soft); color: var(--ok); font-weight: 700; }

/* ================= Feinschliff: Typografie, Rhythmus, Register ================= */
body { -webkit-font-smoothing: antialiased; }
.app { gap: 24px; padding-block: 18px 56px; }
h1, h2, h3 { font-weight: 600; }
.label { font-family: var(--f-body); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
code { border-radius: 4px; padding: 1px 4px; }

/* Kopf + Tabs */
.top { gap: 10px; }
.top svg { width: 34px; height: 34px; }
.brand { flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.brand small { font-size: 13px; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-top: -8px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 0 11px; min-height: 44px; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 17px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.tabs button:hover { color: var(--fg); }

/* Abschnitte statt Karten: Inhalt liegt auf der Seite, Haarlinien trennen */
.panel { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 22px 0 0; gap: 14px; }
.panel h2, h2.sec { font-size: 21px !important; }
.btn { border-radius: 10px; font-size: 16px; transition: filter .15s, background .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn.ghost { border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface); }
.back { border: 0 !important; padding-left: 0; color: var(--muted); background: none !important; }
.back:hover { color: var(--fg); }

/* Klausur-Countdown + Register der 14 Einheiten */
.plancard { display: flex; flex-direction: column; gap: 12px; }
.countdown { display: flex; align-items: center; gap: 14px; line-height: 1.3; }
.countdown .days { font-family: var(--f-mono); font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.countdown .days.late { color: var(--warn); }
.countdown > span { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.countdown .hint { font-family: var(--f-body); font-weight: 400; font-size: 13px; }
.register { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.bit { display: block; aspect-ratio: 1; border-radius: 3px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.bit.half { background: linear-gradient(to top, var(--accent) 40%, transparent 40%); }
.bit.on { background: var(--accent); box-shadow: none; }
.bit.cur { box-shadow: inset 0 0 0 1.5px var(--line-2), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.bit.on.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.bit.sm { width: 12px; height: 12px; aspect-ratio: auto; border-radius: 2px; }
.plancard > p { font-size: 15px; }
.plancard details[open] { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

/* Startpanel: die eine laute Stelle der Seite – Navy wie das Logo */
.hero { background: var(--ink); color: var(--ink-fg); border-radius: 16px; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; border: 1px solid rgba(61,220,151,.18); box-shadow: 0 0 0 24px rgba(61,220,151,.035), 0 0 0 48px rgba(61,220,151,.02); pointer-events: none; }
.hero .hint { color: var(--ink-muted); }
.hero-top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-muted); }
.prompt { font-family: var(--f-mono); font-weight: 600; color: var(--mint); font-size: 14px; }
.unitlink { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; background: none; padding: 0; min-height: 0; color: inherit; border-radius: 8px; text-align: left; border: 0; position: relative; z-index: 1; }
.ucode { font-family: var(--f-mono); font-weight: 600; font-size: 30px; letter-spacing: -.03em; color: var(--mint); line-height: 1; }
.utitle { font-family: var(--f-display); font-size: 23px; font-weight: 600; line-height: 1.12; text-wrap: balance; }
.chev { font-size: 26px; color: var(--ink-muted); }
.steps3 { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.steps3 li { border-top: 3px solid var(--ink-2); padding-top: 7px; display: flex; flex-direction: column; font-size: 12px; color: var(--ink-muted); min-width: 0; line-height: 1.35; }
.steps3 li b { font-weight: 500; font-size: 13px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps3 li span { font-family: var(--f-mono); }
.steps3 li.ok { border-top-color: var(--mint); }
.steps3 li.now { border-top-color: var(--ink-fg); }
.steps3 li.now b, .steps3 li.now span { color: var(--ink-fg); }
.timepick { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 10px; --tr-on: var(--accent); --tr-off: var(--line-2); --th-bg: var(--surface); }
.hero .timepick { --tr-on: var(--mint); --tr-off: var(--ink-2); --th-bg: var(--ink); }
.timepick label { font-size: 13px; color: var(--muted); }
.hero .timepick label { color: var(--ink-muted); }
.tval { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.tval output { font-size: 26px; font-weight: 500; color: var(--fg); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hero .tval { color: var(--ink-muted); }
.hero .tval output { color: var(--ink-fg); }
.timepick input[type=range] { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; background: transparent; height: 32px; margin: 0; width: 100%; }
.timepick input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--tr-on) var(--p, 30%), var(--tr-off) var(--p, 30%)); }
.timepick input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--tr-off); }
.timepick input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--tr-on); }
.timepick input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--th-bg); border: 5px solid var(--tr-on); margin-top: -9px; }
.timepick input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--th-bg); border: 5px solid var(--tr-on); }
.tabs + .panel, .tabs + .plancard { border-top: 0; padding-top: 0; }
.hero .plan { font-size: 13.5px; color: var(--ink-fg); gap: 6px; }
.hero .plan .tag { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-2); color: var(--ink-muted); font-size: 11px; min-width: 64px; text-align: center; }
.hero .plan .tag.rev { box-shadow: inset 0 0 0 1px rgba(255,131,137,.45); color: #FF9CA1; background: transparent; }
.hero .plan .hint { font-size: 13px; }
.hero .btn.go { background: var(--mint); color: #072117; font-size: 17px; min-height: 52px; }
.herolinks { display: flex; flex-wrap: wrap; gap: 0 20px; margin-top: -8px; }
.tlink { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--ink-fg); font-size: 14px; text-decoration: underline; text-decoration-color: rgba(232,238,247,.35); text-underline-offset: 4px; }
.tlink:hover { text-decoration-color: var(--mint); }
.hero :focus-visible { outline-color: var(--mint); }
.hero .chev, .hero .unitlink:hover .utitle { transition: color .15s; }
.hero .unitlink:hover .chev { color: var(--mint); }

/* Kennzahlen: drei ruhige Zahlen, keine Kacheln */
.figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.figures .stat b { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.04em; line-height: 1.1; }
.figures .stat b small { font-size: 15px; color: var(--muted); letter-spacing: 0; }
.figures .stat span { font-size: 13px; color: var(--muted); }
.stats .stat b { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.03em; }

/* Lehrplan und Klausurbereiche */
.chap { grid-template-columns: 44px minmax(0,1fr) auto; padding: 13px 0; gap: 14px; }
.chap .code { background: none; font-size: 14px; text-align: left; padding: 0; color: var(--muted); }
.chap.focus .code { background: none; color: var(--accent); }
.chap.focus .name { font-weight: 600; }
.chap:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.stages { gap: 3px; margin-top: 7px; max-width: 168px; }
.stages i { height: 3px; }

/* Einheit, Skript, Stufen */
.stage { padding-block: 12px; }
.stage .num { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.tocitem { padding: 11px 0; }
.tocitem:hover span:nth-child(2) { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.tick { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.tick.on { box-shadow: none; background: var(--ok-soft); }
.chip { border-color: var(--line-2); background: transparent; }
.chip:hover { border-color: var(--fg); }
.pill { font-family: var(--f-body); font-size: 12px; font-weight: 500; }
.esa { padding-block: 16px; }
.esa b { font-family: var(--f-display); font-size: 17px; }

/* Session */
.sbar { border-bottom: 0; padding-block: 12px; }
.prog i { height: 4px; }
.prog i.now { background: var(--fg); }
.clock { font-weight: 500; font-size: 20px; letter-spacing: -.03em; }
.iconbtn { border-color: var(--line-2); background: transparent; }
.card { border: 0; border-radius: 16px; padding: 22px 20px; gap: 16px; box-shadow: 0 0 0 1px var(--line), 0 14px 34px -20px var(--shadow); }
.card h2 { font-size: 26px; line-height: 1.12; }
.q { font-size: 18px; font-weight: 500; line-height: 1.45; }
.ans { border-color: var(--line-2); border-radius: 10px; padding: 12px 14px; gap: 12px; transition: border-color .12s, background .12s; }
.ans:hover:not(:disabled) { border-color: var(--fg); }
.ans .k { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; font-size: 12px; }
.ans.right .k { background: var(--ok); color: var(--surface); box-shadow: none; }
.ans.wrong .k { background: var(--bad); color: var(--surface); box-shadow: none; }
.why { border-radius: 0 10px 10px 0; border-left: 3px solid; padding: 12px 14px; line-height: 1.5; }
.why.ok { border-color: var(--ok); }
.why.no { border-color: var(--bad); }
.why b { margin-bottom: 3px; }
.learn { padding-left: 0; list-style: none; gap: 10px; }
.learn li { padding-left: 22px; position: relative; }
.learn li::before { content: ">"; position: absolute; left: 2px; top: 0; font-family: var(--f-mono); font-weight: 600; color: var(--accent); }
.task { border: 0; border-radius: 10px; background: var(--accent-soft); }
pre { border-radius: 10px; padding: 14px 16px; line-height: 1.6; }
.seg { background: none; box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 10px; padding: 3px; }
.seg button { border-radius: 8px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.big { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.04em; font-size: 34px; }

/* Lesetext: ruhig gesetzt wie ein gutes Skript */
.read { font-size: 16.5px; line-height: 1.68; gap: 14px; }
.read strong { font-weight: 600; }
.read pre { margin-block: 2px; }
.pit { border-left-color: var(--warn); background: var(--warn-soft); }
.pit b { color: var(--warn); }
input.gap { background: rgba(147,165,194,.2); border-bottom-color: var(--mint); }
.filltext input.gap { background: var(--surface-2); border-bottom-color: var(--accent); }

.unithead { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: start; }
.unithead .ucode { color: var(--accent); font-size: 28px; padding-top: 3px; }
.unithead h1 { font-size: 26px; line-height: 1.12; }
.unithead .hint { margin-top: 4px; }
:root:not([data-theme="light"]) .hero { box-shadow: inset 0 0 0 1px rgba(232,238,247,.06); }
@media (prefers-reduced-motion: no-preference) {
  .hero .prompt::after { content: ""; display: inline-block; width: .55em; height: 2px; margin-left: 2px; background: var(--mint); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
}
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .6 } } }
